<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <clipPath id="flagClip">
      <rect x="5" y="8" width="60" height="44" rx="2"/>
    </clipPath>
  </defs>

  <!-- EU Flag Background -->
  <rect x="5" y="8" width="60" height="44" rx="2" fill="#003399"/>

  <!-- EU Stars -->
  <g fill="#FFCC00" clip-path="url(#flagClip)">
