    <polygon points="35,14 36.5,18.5 41,18.5 37.5,21.5 39,26 35,23 31,26 32.5,21.5 29,18.5 33.5,18.5" transform="rotate(0, 35, 30)"/>
    <polygon points="35,14 36.5,18.5 41,18.5 37.5,21.5 39,26 35,23 31,26 32.5,21.5 29,18.5 33.5,18.5" transform="rotate(30, 35, 30)"/>
