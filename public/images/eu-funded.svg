  <!-- Text -->
  <text x="75" y="25" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#003399">Funded by the</text>
  <text x="75" y="40" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#003399">European Union</text>
</svg>
