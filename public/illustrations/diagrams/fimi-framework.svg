<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <!-- Background -->
  <rect width="700" height="450" fill="#f8fafc"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">FIMI - Foreign Information Manipulation &amp; Interference</text>
  <text x="350" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Understanding state-sponsored disinformation</text>

  <!-- Definition box -->
  <rect x="50" y="70" width="600" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="350" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3730a3">FIMI = Coordinated, deceptive behavior by state or non-state actors</text>
  <text x="350" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3730a3">targeting democratic processes, public opinion, or security</text>

  <!-- Key characteristics -->
  <text x="350" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#334155">Key Characteristics</text>

  <rect x="40" y="180" width="150" height="90" rx="8" fill="#ef4444" opacity="0.9"/>
  <text x="115" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">COORDINATED</text>
  <text x="115" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">Multiple actors</text>
  <text x="115" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">working together</text>
  <text x="115" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">with shared goals</text>

  <rect x="210" y="180" width="150" height="90" rx="8" fill="#f59e0b" opacity="0.9"/>
  <text x="285" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">DECEPTIVE</text>
  <text x="285" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">Hidden origins</text>
  <text x="285" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">False personas</text>
  <text x="285" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">Misleading content</text>

  <rect x="380" y="180" width="150" height="90" rx="8" fill="#8b5cf6" opacity="0.9"/>
  <text x="455" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">FOREIGN</text>
  <text x="455" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">State actors or</text>
  <text x="455" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">state-affiliated</text>
  <text x="455" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">entities abroad</text>

  <rect x="550" y="180" width="110" height="90" rx="8" fill="#3b82f6" opacity="0.9"/>
  <text x="605" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">HARMFUL</text>
  <text x="605" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">Targets</text>
  <text x="605" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">democratic</text>
  <text x="605" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">values/security</text>

  <!-- Common tactics -->
  <text x="350" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#334155">Common FIMI Tactics</text>

  <rect x="50" y="315" width="190" height="60" rx="6" fill="#fee2e2"/>
  <text x="145" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">Amplification</text>
  <text x="145" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7f1d1d">Bots, trolls, coordinated sharing</text>

  <rect x="255" y="315" width="190" height="60" rx="6" fill="#fef3c7"/>
  <text x="350" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#92400e">Impersonation</text>
  <text x="350" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#78350f">Fake accounts, stolen identities</text>

  <rect x="460" y="315" width="190" height="60" rx="6" fill="#e0f2fe"/>
  <text x="555" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0369a1">Narrative Seeding</text>
  <text x="555" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#0c4a6e">Planting stories in media ecosystem</text>

  <!-- Response note -->
  <rect x="100" y="395" width="500" height="45" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="350" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#166534">EU Response: EEAS established dedicated FIMI monitoring</text>
  <text x="350" y="432" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#166534">Focus: Attribution, exposure, building resilience</text>
</svg>