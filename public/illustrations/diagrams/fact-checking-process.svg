<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <!-- Background -->
  <rect width="700" height="400" fill="#f8fafc"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Fact-Checking Process</text>
  <text x="350" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">A systematic approach to verifying claims</text>

  <!-- Step 1 -->
  <circle cx="100" cy="130" r="40" fill="#3b82f6" opacity="0.9"/>
  <text x="100" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="white">1</text>
  <text x="100" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">IDENTIFY</text>
  <text x="100" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#334155">What exact claim</text>
  <text x="100" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#334155">is being made?</text>

  <!-- Arrow -->
  <line x1="145" y1="130" x2="185" y2="130" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="185,125 195,130 185,135" fill="#94a3b8"/>

  <!-- Step 2 -->
  <circle cx="240" cy="130" r="40" fill="#8b5cf6" opacity="0.9"/>
  <text x="240" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="white">2</text>
  <text x="240" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">SOURCE</text>
  <text x="240" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Who made it?</text>
  <text x="240" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#334155">What's the origin?</text>

  <!-- Arrow -->
  <line x1="285" y1="130" x2="325" y2="130" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="325,125 335,130 325,135" fill="#94a3b8"/>

  <!-- Step 3 -->
  <circle cx="380" cy="130" r="40" fill="#22c55e" opacity="0.9"/>
  <text x="380" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="white">3</text>
  <text x="380" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">VERIFY</text>
  <text x="380" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Check against</text>
  <text x="380" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#334155">reliable sources</text>

  <!-- Arrow -->
  <line x1="425" y1="130" x2="465" y2="130" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="465,125 475,130 465,135" fill="#94a3b8"/>

  <!-- Step 4 -->
  <circle cx="520" cy="130" r="40" fill="#f59e0b" opacity="0.9"/>
  <text x="520" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="white">4</text>
  <text x="520" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">CONTEXT</text>
  <text x="520" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#334155">What's missing?</text>
  <text x="520" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Full picture?</text>

  <!-- Arrow -->
  <line x1="565" y1="130" x2="605" y2="130" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="605,125 615,130 605,135" fill="#94a3b8"/>

  <!-- Step 5 -->
  <circle cx="660" cy="130" r="35" fill="#ef4444" opacity="0.9"/>
  <text x="660" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="white">5</text>
  <text x="660" y="143" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">CONCLUDE</text>

  <!-- Verification tools -->
  <text x="350" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#334155">Verification Tools</text>

  <rect x="40" y="270" width="140" height="55" rx="6" fill="#e0f2fe"/>
  <text x="110" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0369a1">Image Search</text>
  <text x="110" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#0c4a6e">Google, TinEye, Yandex</text>

  <rect x="200" y="270" width="140" height="55" rx="6" fill="#fef3c7"/>
  <text x="270" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#92400e">Fact-Check DBs</text>
  <text x="270" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#78350f">Snopes, PolitiFact</text>

  <rect x="360" y="270" width="140" height="55" rx="6" fill="#f0fdf4"/>
  <text x="430" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#166534">Archives</text>
  <text x="430" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Wayback, Archive.today</text>

  <rect x="520" y="270" width="140" height="55" rx="6" fill="#e0e7ff"/>
  <text x="590" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#3730a3">Geolocation</text>
  <text x="590" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#4338ca">Maps, street view</text>

  <!-- Bottom tip -->
  <rect x="100" y="350" width="500" height="40" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="350" y="368" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#991b1b">Remember: Being first is not as important as being accurate</text>
  <text x="350" y="383" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#991b1b">Take your time - rushing leads to mistakes</text>
</svg>