<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <defs>
    <linearGradient id="high" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="med" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="low" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" fill="#f8fafc"/>

  <!-- Title -->
  <text x="250" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Evidence Ladder</text>
  <text x="250" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Confidence levels for classification</text>

  <!-- Ladder rails -->
  <line x1="120" y1="80" x2="120" y2="370" stroke="#94a3b8" stroke-width="4"/>
  <line x1="380" y1="80" x2="380" y2="370" stroke="#94a3b8" stroke-width="4"/>

  <!-- HIGH confidence rung -->
  <rect x="100" y="85" width="300" height="70" rx="8" fill="url(#high)"/>
  <text x="130" y="115" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">HIGH CONFIDENCE</text>
  <text x="130" y="135" font-family="system-ui, sans-serif" font-size="11" fill="white">• Multiple independent sources confirm</text>
  <text x="130" y="148" font-family="system-ui, sans-serif" font-size="11" fill="white">• Clear evidence of intent/coordination</text>

  <!-- MEDIUM confidence rung -->
  <rect x="100" y="175" width="300" height="80" rx="8" fill="url(#med)"/>
  <text x="130" y="205" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">MEDIUM CONFIDENCE</text>
  <text x="130" y="225" font-family="system-ui, sans-serif" font-size="11" fill="white">• Some verification, some gaps</text>
  <text x="130" y="238" font-family="system-ui, sans-serif" font-size="11" fill="white">• Intent suggested but not proven</text>
  <text x="130" y="251" font-family="system-ui, sans-serif" font-size="11" fill="white">• Patterns consistent with known tactics</text>

  <!-- LOW confidence rung -->
  <rect x="100" y="275" width="300" height="80" rx="8" fill="url(#low)"/>
  <text x="130" y="305" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">LOW CONFIDENCE</text>
  <text x="130" y="325" font-family="system-ui, sans-serif" font-size="11" fill="white">• Limited verification possible</text>
  <text x="130" y="338" font-family="system-ui, sans-serif" font-size="11" fill="white">• Intent unclear</text>
  <text x="130" y="351" font-family="system-ui, sans-serif" font-size="11" fill="white">• Could be organic or coordinated</text>

  <!-- Arrow showing direction -->
  <path d="M450,350 L450,100 L440,115 M450,100 L460,115" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="460" y="230" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" transform="rotate(-90, 460, 230)">More Evidence</text>

  <!-- Stop rule note -->
  <rect x="30" y="365" width="440" height="28" rx="5" fill="#fef3c7"/>
  <text x="250" y="384" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">⚠️ Stop Rule: Don't claim HIGH confidence without HIGH evidence</text>
</svg>