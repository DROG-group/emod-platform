<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <!-- Background -->
  <rect width="700" height="400" fill="#f8fafc"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Media Literacy Framework</text>
  <text x="350" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">5 Key Questions for Critical Analysis</text>

  <!-- Central hub -->
  <circle cx="350" cy="210" r="50" fill="#6366f1" opacity="0.9"/>
  <text x="350" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">MEDIA</text>
  <text x="350" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">MESSAGE</text>

  <!-- Question 1: Who -->
  <circle cx="180" cy="100" r="45" fill="#ef4444" opacity="0.9"/>
  <text x="180" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">WHO</text>
  <text x="180" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">created this?</text>
  <line x1="220" y1="130" x2="310" y2="175" stroke="#ef4444" stroke-width="2"/>

  <!-- Question 2: What -->
  <circle cx="520" cy="100" r="45" fill="#f59e0b" opacity="0.9"/>
  <text x="520" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">WHAT</text>
  <text x="520" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">techniques used?</text>
  <line x1="480" y1="130" x2="390" y2="175" stroke="#f59e0b" stroke-width="2"/>

  <!-- Question 3: How -->
  <circle cx="130" cy="280" r="45" fill="#22c55e" opacity="0.9"/>
  <text x="130" y="275" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">HOW</text>
  <text x="130" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">might others see it?</text>
  <line x1="170" y1="255" x2="305" y2="225" stroke="#22c55e" stroke-width="2"/>

  <!-- Question 4: Why -->
  <circle cx="350" cy="340" r="45" fill="#3b82f6" opacity="0.9"/>
  <text x="350" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">WHY</text>
  <text x="350" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">was this made?</text>
  <line x1="350" y1="295" x2="350" y2="260" stroke="#3b82f6" stroke-width="2"/>

  <!-- Question 5: What's missing -->
  <circle cx="570" cy="280" r="45" fill="#8b5cf6" opacity="0.9"/>
  <text x="570" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">WHAT'S</text>
  <text x="570" y="285" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">MISSING?</text>
  <text x="570" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">left out?</text>
  <line x1="530" y1="255" x2="395" y2="225" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Bottom tip -->
  <rect x="150" y="370" width="400" height="25" rx="5" fill="#fef3c7"/>
  <text x="350" y="387" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#92400e">Ask these questions every time you encounter media content</text>
</svg>