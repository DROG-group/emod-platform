<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <defs>
    <linearGradient id="step" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="450" fill="#f8fafc"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Classification Workflow</text>

  <!-- Step 1 -->
  <rect x="50" y="60" width="180" height="70" rx="10" fill="url(#step)" opacity="0.9"/>
  <text x="140" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">1. IDENTIFY</text>
  <text x="140" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Is the claim verifiable?</text>
  <text x="140" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">What's being claimed?</text>

  <!-- Arrow 1 -->
  <line x1="230" y1="95" x2="280" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="290" y="60" width="180" height="70" rx="10" fill="url(#step)" opacity="0.85"/>
  <text x="380" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">2. VERIFY</text>
  <text x="380" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Is it true or false?</text>
  <text x="380" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Check multiple sources</text>

  <!-- Arrow 2 -->
  <line x1="470" y1="95" x2="520" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="530" y="60" width="150" height="70" rx="10" fill="url(#step)" opacity="0.8"/>
  <text x="605" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">3. ASSESS INTENT</text>
  <text x="605" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Was harm intended?</text>

  <!-- Decision Diamond -->
  <polygon points="350,170 420,220 350,270 280,220" fill="#f59e0b" opacity="0.9"/>
  <text x="350" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">FALSE?</text>
  <text x="350" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Content</text>

  <!-- Arrow to diamond -->
  <line x1="350" y1="130" x2="350" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Yes path -->
  <line x1="420" y1="220" x2="500" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="210" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Yes</text>

  <!-- No path -->
  <line x1="280" y1="220" x2="200" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="210" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">No</text>

  <!-- Malinformation box -->
  <rect x="80" y="190" width="120" height="60" rx="8" fill="#8b5cf6" opacity="0.9"/>
  <text x="140" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">MALINFORMATION</text>
  <text x="140" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">True but harmful</text>

  <!-- Intent check -->
  <polygon points="560,170 630,220 560,270 490,220" fill="#ef4444" opacity="0.9"/>
  <text x="560" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white">INTENT</text>
  <text x="560" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">to deceive?</text>

  <!-- Misinformation -->
  <rect x="440" y="310" width="120" height="55" rx="8" fill="#f59e0b" opacity="0.9"/>
  <text x="500" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">MISINFORMATION</text>
  <text x="500" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">No intent to harm</text>

  <!-- Disinformation -->
  <rect x="580" y="310" width="110" height="55" rx="8" fill="#dc2626" opacity="0.9"/>
  <text x="635" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">DISINFORMATION</text>
  <text x="635" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">Deliberate deception</text>

  <!-- Paths from intent -->
  <line x1="530" y1="250" x2="500" y2="305" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="280" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">No</text>

  <line x1="590" y1="250" x2="620" y2="305" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="280" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Yes</text>

  <!-- Confidence note -->
  <rect x="50" y="380" width="600" height="50" rx="8" fill="#e2e8f0"/>
  <text x="350" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">💡 Always assign a confidence level: High / Medium / Low</text>
  <text x="350" y="418" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Intent is often hard to prove — report confidence honestly</text>
</svg>