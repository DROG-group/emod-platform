<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <defs>
    <linearGradient id="source" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="400" fill="#f8fafc"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">How Information Spreads Online</text>

  <!-- Source node -->
  <circle cx="100" cy="200" r="35" fill="url(#source)"/>
  <text x="100" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white">SOURCE</text>
  <text x="100" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">Original</text>

  <!-- First wave -->
  <circle cx="220" cy="120" r="22" fill="#f97316" opacity="0.9"/>
  <circle cx="220" cy="200" r="22" fill="#f97316" opacity="0.9"/>
  <circle cx="220" cy="280" r="22" fill="#f97316" opacity="0.9"/>

  <!-- Connections from source -->
  <line x1="135" y1="185" x2="198" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <line x1="135" y1="200" x2="198" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="135" y1="215" x2="198" y2="270" stroke="#94a3b8" stroke-width="2"/>

  <!-- Second wave -->
  <circle cx="330" cy="80" r="18" fill="#fbbf24" opacity="0.85"/>
  <circle cx="330" cy="140" r="18" fill="#fbbf24" opacity="0.85"/>
  <circle cx="330" cy="200" r="18" fill="#fbbf24" opacity="0.85"/>
  <circle cx="330" cy="260" r="18" fill="#fbbf24" opacity="0.85"/>
  <circle cx="330" cy="320" r="18" fill="#fbbf24" opacity="0.85"/>

  <!-- Connections wave 1 to 2 -->
  <line x1="242" y1="110" x2="312" y2="85" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="242" y1="125" x2="312" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="242" y1="200" x2="312" y2="200" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="242" y1="275" x2="312" y2="260" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="242" y1="290" x2="312" y2="320" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Third wave - viral spread -->
  <circle cx="430" cy="60" r="14" fill="#a3e635" opacity="0.8"/>
  <circle cx="430" cy="100" r="14" fill="#a3e635" opacity="0.8"/>
  <circle cx="430" cy="140" r="14" fill="#a3e635" opacity="0.8"/>
  <circle cx="430" cy="180" r="14" fill="#a3e635" opacity="0.8"/>
  <circle cx="430" cy="220" r="14" fill="#a3e635" opacity="0.8"/>
  <circle cx="430" cy="260" r="14" fill="#a3e635" opacity="0.8"/>
  <circle cx="430" cy="300" r="14" fill="#a3e635" opacity="0.8"/>
  <circle cx="430" cy="340" r="14" fill="#a3e635" opacity="0.8"/>

  <!-- Fourth wave -->
  <circle cx="510" cy="50" r="10" fill="#22d3ee" opacity="0.75"/>
  <circle cx="510" cy="80" r="10" fill="#22d3ee" opacity="0.75"/>
  <circle cx="510" cy="110" r="10" fill="#22d3ee" opacity="0.75"/>
  <circle cx="510" cy="140" r="10" fill="#22d3ee" opacity="0.75"/>
  <circle cx="510" cy="170" r="10" fill="#22d3ee" opacity="0.75"/>
  <circle cx="510" cy="200" r="10" fill="#22d3ee" opacity="0.75"/>
  <circle cx="510" cy="230" r="10" fill="#22d3ee" opacity="0.75"/>
  <circle cx="510" cy="260" r="10" fill="#22d3ee" opacity="0.75"/>
  <circle cx="510" cy="290" r="10" fill="#22d3ee" opacity="0.75"/>
  <circle cx="510" cy="320" r="10" fill="#22d3ee" opacity="0.75"/>
  <circle cx="510" cy="350" r="10" fill="#22d3ee" opacity="0.75"/>

  <!-- Many small dots representing viral spread -->
  <circle cx="580" cy="40" r="6" fill="#a78bfa" opacity="0.6"/>
  <circle cx="600" cy="55" r="6" fill="#a78bfa" opacity="0.6"/>
  <circle cx="580" cy="70" r="6" fill="#a78bfa" opacity="0.6"/>
  <circle cx="600" cy="90" r="6" fill="#a78bfa" opacity="0.6"/>
  <circle cx="580" cy="110" r="6" fill="#a78bfa" opacity="0.6"/>
  <circle cx="600" cy="130" r="6" fill="#a78bfa" opacity="0.6"/>
  <circle cx="580" cy="150" r="6" fill="#a78bfa" opacity="0.6"/>
  <circle cx="600" cy="170" r="6" fill="#a78bfa" opacity="0.6"/>
  <circle cx="580" cy="190" r="6" fill="#a78bfa" opacity="0.6"/>
  <circle cx="600" cy="210" r="6" fill="#a78bfa" opacity="0.6"/>
  <circle cx="580" cy="230" r="6" fill="#a78bfa" opacity="0.6"/>
  <circle cx="600" cy="250" r="6" fill="#a78bfa" opacity="0.6"/>
  <circle cx="580" cy="270" r="6" fill="#a78bfa" opacity="0.6"/>
  <circle cx="600" cy="290" r="6" fill="#a78bfa" opacity="0.6"/>
  <circle cx="580" cy="310" r="6" fill="#a78bfa" opacity="0.6"/>
  <circle cx="600" cy="330" r="6" fill="#a78bfa" opacity="0.6"/>
  <circle cx="580" cy="350" r="6" fill="#a78bfa" opacity="0.6"/>
  <circle cx="620" cy="360" r="6" fill="#a78bfa" opacity="0.6"/>

  <!-- Time arrow -->
  <line x1="80" y1="380" x2="650" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="365" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Time →</text>

  <!-- Labels -->
  <text x="100" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#dc2626">1</text>
  <text x="220" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#f97316">3</text>
  <text x="330" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#fbbf24">5</text>
  <text x="430" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#a3e635">8</text>
  <text x="510" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#22d3ee">11</text>
  <text x="590" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#a78bfa">18+</text>

  <!-- Key insight box -->
  <rect x="50" y="50" width="200" height="45" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="150" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">⚡ Exponential Growth</text>
  <text x="150" y="83" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7f1d1d">Each share multiplies reach</text>
</svg>