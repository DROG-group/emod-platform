<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <!-- Background -->
  <rect width="700" height="450" fill="#f8fafc"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Key Cognitive Biases in Misinformation</text>

  <!-- Brain outline in center -->
  <ellipse cx="350" cy="225" rx="100" ry="85" fill="#e0e7ff" opacity="0.4" stroke="#6366f1" stroke-width="2"/>

  <!-- Confirmation Bias -->
  <rect x="30" y="70" width="180" height="90" rx="10" fill="#ef4444" opacity="0.9"/>
  <text x="120" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">CONFIRMATION BIAS</text>
  <text x="120" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Seeking info that confirms</text>
  <text x="120" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">existing beliefs</text>
  <text x="120" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="white">🔍</text>
  <line x1="210" y1="115" x2="260" y2="180" stroke="#ef4444" stroke-width="2"/>

  <!-- Availability Heuristic -->
  <rect x="490" y="70" width="180" height="90" rx="10" fill="#f59e0b" opacity="0.9"/>
  <text x="580" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">AVAILABILITY HEURISTIC</text>
  <text x="580" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Overweighting easily</text>
  <text x="580" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">recalled examples</text>
  <text x="580" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="white">💭</text>
  <line x1="490" y1="115" x2="440" y2="180" stroke="#f59e0b" stroke-width="2"/>

  <!-- Anchoring Bias -->
  <rect x="30" y="190" width="180" height="90" rx="10" fill="#8b5cf6" opacity="0.9"/>
  <text x="120" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">ANCHORING BIAS</text>
  <text x="120" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Over-relying on first</text>
  <text x="120" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">piece of information</text>
  <text x="120" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="white">⚓</text>
  <line x1="210" y1="235" x2="250" y2="225" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Bandwagon Effect -->
  <rect x="490" y="190" width="180" height="90" rx="10" fill="#3b82f6" opacity="0.9"/>
  <text x="580" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">BANDWAGON EFFECT</text>
  <text x="580" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Believing because</text>
  <text x="580" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">many others believe</text>
  <text x="580" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="white">👥</text>
  <line x1="490" y1="235" x2="450" y2="225" stroke="#3b82f6" stroke-width="2"/>

  <!-- Illusory Truth Effect -->
  <rect x="30" y="310" width="180" height="90" rx="10" fill="#22c55e" opacity="0.9"/>
  <text x="120" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">ILLUSORY TRUTH</text>
  <text x="120" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Repeated claims feel</text>
  <text x="120" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">more true</text>
  <text x="120" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="white">🔄</text>
  <line x1="210" y1="355" x2="270" y2="280" stroke="#22c55e" stroke-width="2"/>

  <!-- Authority Bias -->
  <rect x="490" y="310" width="180" height="90" rx="10" fill="#ec4899" opacity="0.9"/>
  <text x="580" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">AUTHORITY BIAS</text>
  <text x="580" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Trusting experts even</text>
  <text x="580" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">outside their field</text>
  <text x="580" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="white">👔</text>
  <line x1="490" y1="355" x2="430" y2="280" stroke="#ec4899" stroke-width="2"/>

  <!-- Center brain text -->
  <text x="350" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#4338ca">BRAIN</text>
  <text x="350" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4338ca">Mental shortcuts</text>

  <!-- Bottom insight -->
  <rect x="220" y="420" width="260" height="25" rx="5" fill="#fef3c7"/>
  <text x="350" y="437" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#92400e">💡 Awareness is the first step to overcoming biases</text>
</svg>