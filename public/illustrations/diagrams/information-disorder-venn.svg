<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="misinfo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="disinfo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="malinfo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#f8fafc"/>

  <!-- Title -->
  <text x="300" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Types of Information Disorder</text>

  <!-- Misinformation circle -->
  <circle cx="220" cy="180" r="110" fill="url(#misinfo)" opacity="0.3" stroke="#f59e0b" stroke-width="3"/>
  <text x="150" y="140" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#92400e">MISINFORMATION</text>
  <text x="130" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#78350f">False information shared</text>
  <text x="130" y="175" font-family="system-ui, sans-serif" font-size="11" fill="#78350f">WITHOUT intent to harm</text>

  <!-- Disinformation circle -->
  <circle cx="380" cy="180" r="110" fill="url(#disinfo)" opacity="0.3" stroke="#dc2626" stroke-width="3"/>
  <text x="380" y="140" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#991b1b">DISINFORMATION</text>
  <text x="360" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">False information shared</text>
  <text x="360" y="175" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">WITH intent to harm</text>

  <!-- Malinformation circle -->
  <circle cx="300" cy="280" r="110" fill="url(#malinfo)" opacity="0.3" stroke="#7c3aed" stroke-width="3"/>
  <text x="240" y="340" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#5b21b6">MALINFORMATION</text>
  <text x="220" y="360" font-family="system-ui, sans-serif" font-size="11" fill="#4c1d95">True information shared</text>
  <text x="220" y="375" font-family="system-ui, sans-serif" font-size="11" fill="#4c1d95">WITH intent to harm</text>

  <!-- Center overlap labels -->
  <text x="300" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#374151">Intent to</text>
  <text x="300" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#374151">Deceive</text>

  <!-- Key characteristics -->
  <rect x="20" y="50" width="12" height="12" fill="#f59e0b" rx="2"/>
  <text x="38" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#374151">Unintentional spread</text>

  <rect x="20" y="70" width="12" height="12" fill="#dc2626" rx="2"/>
  <text x="38" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#374151">Deliberate deception</text>

  <rect x="20" y="90" width="12" height="12" fill="#7c3aed" rx="2"/>
  <text x="38" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#374151">True but harmful context</text>
</svg>