<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
  <defs>
    <linearGradient id="echo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="350" fill="#f8fafc"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Echo Chambers vs Filter Bubbles</text>

  <!-- Echo Chamber Side -->
  <text x="175" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">ECHO CHAMBER</text>
  <text x="175" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Social &amp; Deliberate</text>

  <!-- Echo chamber visualization -->
  <circle cx="175" cy="170" r="90" fill="url(#echo)" opacity="0.15" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="175" cy="170" r="60" fill="url(#echo)" opacity="0.25"/>

  <!-- People in echo chamber -->
  <circle cx="145" cy="150" r="12" fill="#7c3aed"/>
  <circle cx="175" cy="135" r="12" fill="#7c3aed"/>
  <circle cx="205" cy="150" r="12" fill="#7c3aed"/>
  <circle cx="155" cy="185" r="12" fill="#7c3aed"/>
  <circle cx="195" cy="185" r="12" fill="#7c3aed"/>

  <!-- Speech bubbles bouncing -->
  <ellipse cx="130" cy="130" rx="15" ry="10" fill="#a78bfa" opacity="0.7"/>
  <ellipse cx="220" cy="135" rx="15" ry="10" fill="#a78bfa" opacity="0.7"/>
  <ellipse cx="175" cy="210" rx="15" ry="10" fill="#a78bfa" opacity="0.7"/>

  <!-- Arrows showing reinforcement -->
  <path d="M145,165 Q130,175 155,180" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.6"/>
  <path d="M205,165 Q220,175 195,180" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.6"/>

  <!-- Echo chamber characteristics -->
  <text x="175" y="285" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5b21b6">✓ Self-selected communities</text>
  <text x="175" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5b21b6">✓ Active participation</text>
  <text x="175" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5b21b6">✓ Beliefs reinforce each other</text>

  <!-- VS divider -->
  <line x1="350" y1="70" x2="350" y2="320" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="350" cy="170" r="20" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>
  <text x="350" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#64748b">VS</text>

  <!-- Filter Bubble Side -->
  <text x="525" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">FILTER BUBBLE</text>
  <text x="525" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Algorithmic &amp; Passive</text>

  <!-- Filter bubble visualization -->
  <circle cx="525" cy="170" r="90" fill="url(#bubble)" opacity="0.1" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Person in center -->
  <circle cx="525" cy="170" r="20" fill="#3b82f6"/>
  <text x="525" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="white">👤</text>

  <!-- Algorithm filtering content -->
  <rect x="435" y="100" width="30" height="25" rx="3" fill="#22c55e" opacity="0.8"/>
  <text x="450" y="117" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">✓</text>

  <rect x="595" y="110" width="30" height="25" rx="3" fill="#22c55e" opacity="0.8"/>
  <text x="610" y="127" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">✓</text>

  <rect x="445" y="210" width="30" height="25" rx="3" fill="#22c55e" opacity="0.8"/>
  <text x="460" y="227" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">✓</text>

  <!-- Blocked content (outside bubble) -->
  <rect x="400" y="150" width="25" height="20" rx="3" fill="#ef4444" opacity="0.6"/>
  <text x="412" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">✗</text>

  <rect x="625" y="180" width="25" height="20" rx="3" fill="#ef4444" opacity="0.6"/>
  <text x="637" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">✗</text>

  <!-- Arrows from algorithm -->
  <path d="M465,112 L505,155" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M595,122 L545,155" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <path d="M475,222 L510,190" fill="none" stroke="#22c55e" stroke-width="1.5"/>

  <!-- Filter bubble characteristics -->
  <text x="525" y="285" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1d4ed8">✓ Algorithm-curated content</text>
  <text x="525" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1d4ed8">✓ Passive consumption</text>
  <text x="525" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1d4ed8">✓ User unaware of filtering</text>

  <!-- Bottom note -->
  <rect x="100" y="330" width="500" height="18" rx="4" fill="#fef3c7"/>
  <text x="350" y="343" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#92400e">Both reduce exposure to diverse viewpoints — but through different mechanisms</text>
</svg>