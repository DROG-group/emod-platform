<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
  <!-- Background -->
  <rect width="700" height="380" fill="#f8fafc"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">The Prebunking Process</text>
  <text x="350" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Inoculation Theory Applied to Misinformation</text>

  <!-- Step 1: Warn -->
  <rect x="30" y="80" width="150" height="120" rx="10" fill="#f59e0b" opacity="0.9"/>
  <text x="105" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="white">1. WARN</text>
  <text x="105" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="white">!</text>
  <text x="105" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Alert people that</text>
  <text x="105" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">manipulation exists</text>

  <!-- Arrow 1 -->
  <polygon points="190,140 210,130 210,150" fill="#64748b"/>

  <!-- Step 2: Explain -->
  <rect x="220" y="80" width="150" height="120" rx="10" fill="#8b5cf6" opacity="0.9"/>
  <text x="295" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="white">2. EXPLAIN</text>
  <text x="295" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="white">?</text>
  <text x="295" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Describe how the</text>
  <text x="295" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">technique works</text>

  <!-- Arrow 2 -->
  <polygon points="380,140 400,130 400,150" fill="#64748b"/>

  <!-- Step 3: Example -->
  <rect x="410" y="80" width="150" height="120" rx="10" fill="#3b82f6" opacity="0.9"/>
  <text x="485" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="white">3. EXAMPLE</text>
  <text x="485" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="white">[...]</text>
  <text x="485" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Show weakened</text>
  <text x="485" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">examples</text>

  <!-- Arrow 3 -->
  <polygon points="570,140 590,130 590,150" fill="#64748b"/>

  <!-- Step 4: Immunity -->
  <rect x="600" y="80" width="70" height="120" rx="10" fill="#22c55e" opacity="0.9"/>
  <text x="635" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white">BUILD</text>
  <text x="635" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="white">*</text>
  <text x="635" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Resist</text>
  <text x="635" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">future</text>

  <!-- Common manipulation techniques -->
  <text x="350" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#334155">Common Manipulation Techniques to Prebunk</text>

  <rect x="40" y="250" width="145" height="55" rx="8" fill="#fee2e2"/>
  <text x="112" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">Emotional Appeals</text>
  <text x="112" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7f1d1d">Fear, anger, outrage</text>

  <rect x="200" y="250" width="145" height="55" rx="8" fill="#fef3c7"/>
  <text x="272" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#92400e">False Dichotomies</text>
  <text x="272" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#78350f">Only two options exist</text>

  <rect x="360" y="250" width="145" height="55" rx="8" fill="#e0e7ff"/>
  <text x="432" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#3730a3">Scapegoating</text>
  <text x="432" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#4338ca">Blaming one group</text>

  <rect x="520" y="250" width="145" height="55" rx="8" fill="#dcfce7"/>
  <text x="592" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#166534">False Experts</text>
  <text x="592" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Fake authority claims</text>

  <!-- Bottom note -->
  <rect x="100" y="325" width="500" height="40" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="350" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#166534">Research shows prebunking can reduce susceptibility</text>
  <text x="350" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#166534">to misinformation by up to 25%</text>
</svg>