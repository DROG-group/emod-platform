<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <!-- Background -->
  <rect width="600" height="450" fill="#f8fafc"/>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Source Credibility Checklist</text>
  <text x="300" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">SIFT Method + CRAAP Test</text>

  <!-- SIFT Section -->
  <rect x="30" y="70" width="250" height="200" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="155" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0369a1">SIFT Method</text>

  <text x="50" y="125" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0c4a6e">S</text>
  <text x="70" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#334155">top - Pause before sharing</text>

  <text x="50" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0c4a6e">I</text>
  <text x="70" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#334155">nvestigate the source</text>

  <text x="50" y="185" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0c4a6e">F</text>
  <text x="70" y="185" font-family="system-ui, sans-serif" font-size="11" fill="#334155">ind better coverage</text>

  <text x="50" y="215" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0c4a6e">T</text>
  <text x="70" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#334155">race claims to origin</text>

  <rect x="50" y="235" width="210" height="25" rx="4" fill="#0284c7" opacity="0.2"/>
  <text x="155" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#0c4a6e">Quick lateral reading technique</text>

  <!-- CRAAP Section -->
  <rect x="320" y="70" width="250" height="250" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="445" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">CRAAP Test</text>

  <text x="340" y="125" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#78350f">C</text>
  <text x="360" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#334155">urrency - Is it recent?</text>

  <text x="340" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#78350f">R</text>
  <text x="360" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#334155">elevance - Does it fit needs?</text>

  <text x="340" y="185" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#78350f">A</text>
  <text x="360" y="185" font-family="system-ui, sans-serif" font-size="11" fill="#334155">uthority - Who wrote it?</text>

  <text x="340" y="215" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#78350f">A</text>
  <text x="360" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#334155">ccuracy - Is it supported?</text>

  <text x="340" y="245" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#78350f">P</text>
  <text x="360" y="245" font-family="system-ui, sans-serif" font-size="11" fill="#334155">urpose - Why does it exist?</text>

  <rect x="340" y="270" width="210" height="40" rx="4" fill="#f59e0b" opacity="0.2"/>
  <text x="445" y="287" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#78350f">Score each 1-5, total below</text>
  <text x="445" y="302" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#78350f">15 = unreliable source</text>

  <!-- Red Flags Section -->
  <rect x="30" y="290" width="540" height="130" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="300" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Red Flags to Watch For</text>

  <text x="60" y="345" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">No author or anonymous</text>
  <text x="60" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">No date published</text>
  <text x="60" y="385" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">Extreme emotional language</text>

  <text x="250" y="345" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">No sources cited</text>
  <text x="250" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">Clickbait headlines</text>
  <text x="250" y="385" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">Too good/bad to be true</text>

  <text x="420" y="345" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">Unknown domain</text>
  <text x="420" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">No contact info</text>
  <text x="420" y="385" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">Asks you to share urgently</text>

  <!-- Bottom tip -->
  <rect x="100" y="425" width="400" height="22" rx="5" fill="#dcfce7"/>
  <text x="300" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#166534">When in doubt, don't share - verify first!</text>
</svg>