<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <!-- Background -->
  <rect width="700" height="450" fill="#f8fafc"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Deepfake Detection Guide</text>
  <text x="350" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Visual and Audio Indicators</text>

  <!-- Face/Video Section -->
  <rect x="30" y="70" width="310" height="180" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="185" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">Visual Signs</text>

  <!-- Face icon -->
  <circle cx="80" cy="150" r="35" fill="#fbbf24" opacity="0.3" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="70" cy="143" r="5" fill="#78350f"/>
  <circle cx="90" cy="143" r="5" fill="#78350f"/>
  <path d="M70,165 Q80,175 90,165" fill="none" stroke="#78350f" stroke-width="2"/>

  <!-- Visual indicators -->
  <text x="130" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Unnatural eye blinking</text>
  <text x="130" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Blurry face edges</text>
  <text x="130" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Lighting inconsistencies</text>
  <text x="130" y="185" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Strange skin textures</text>
  <text x="130" y="205" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Hair/teeth look wrong</text>
  <text x="130" y="225" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Face doesn't match body</text>

  <!-- Audio Section -->
  <rect x="360" y="70" width="310" height="180" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="515" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0369a1">Audio Signs</text>

  <!-- Audio wave icon -->
  <rect x="390" y="130" width="60" height="50" fill="#0ea5e9" opacity="0.2" rx="5"/>
  <line x1="400" y1="155" x2="410" y2="145" stroke="#0369a1" stroke-width="2"/>
  <line x1="410" y1="145" x2="420" y2="165" stroke="#0369a1" stroke-width="2"/>
  <line x1="420" y1="165" x2="430" y2="140" stroke="#0369a1" stroke-width="2"/>
  <line x1="430" y1="140" x2="440" y2="155" stroke="#0369a1" stroke-width="2"/>

  <!-- Audio indicators -->
  <text x="470" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Robotic tone</text>
  <text x="470" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Lip sync mismatch</text>
  <text x="470" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Unnatural pauses</text>
  <text x="470" y="185" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Missing breath sounds</text>
  <text x="470" y="205" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Background audio issues</text>
  <text x="470" y="225" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Emotion doesn't match</text>

  <!-- Tools Section -->
  <rect x="30" y="270" width="640" height="90" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="350" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#166534">Detection Tools &amp; Techniques</text>

  <rect x="50" y="310" width="140" height="40" rx="6" fill="#22c55e" opacity="0.2"/>
  <text x="120" y="327" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#166534">Reverse Image</text>
  <text x="120" y="342" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#166534">Google, TinEye</text>

  <rect x="210" y="310" width="140" height="40" rx="6" fill="#22c55e" opacity="0.2"/>
  <text x="280" y="327" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#166534">AI Detection</text>
  <text x="280" y="342" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#166534">Deepware, Sensity</text>

  <rect x="370" y="310" width="140" height="40" rx="6" fill="#22c55e" opacity="0.2"/>
  <text x="440" y="327" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#166534">Metadata Check</text>
  <text x="440" y="342" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#166534">EXIF data analysis</text>

  <rect x="530" y="310" width="120" height="40" rx="6" fill="#22c55e" opacity="0.2"/>
  <text x="590" y="327" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#166534">Slow Motion</text>
  <text x="590" y="342" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#166534">Frame-by-frame</text>

  <!-- Warning -->
  <rect x="100" y="380" width="500" height="55" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="350" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">AI is improving rapidly</text>
  <text x="350" y="425" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7f1d1d">These signs may not always be present - when in doubt, verify the source and context</text>
</svg>