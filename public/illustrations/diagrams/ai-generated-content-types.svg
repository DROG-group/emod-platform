<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <!-- Background -->
  <rect width="700" height="400" fill="#f8fafc"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Types of AI-Generated Content</text>

  <!-- Text Generation -->
  <rect x="30" y="60" width="200" height="150" rx="10" fill="#8b5cf6" opacity="0.9"/>
  <text x="130" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">TEXT</text>
  <text x="130" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="white">Aa</text>
  <text x="130" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Articles, social posts</text>
  <text x="130" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Comments, reviews</text>
  <text x="130" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Fake news stories</text>
  <rect x="50" y="185" width="160" height="18" rx="3" fill="white" opacity="0.2"/>
  <text x="130" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">ChatGPT, Claude, etc.</text>

  <!-- Image Generation -->
  <rect x="250" y="60" width="200" height="150" rx="10" fill="#3b82f6" opacity="0.9"/>
  <text x="350" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">IMAGES</text>
  <rect x="320" y="100" width="60" height="45" rx="5" fill="white" opacity="0.3"/>
  <circle cx="335" cy="115" r="8" fill="white" opacity="0.5"/>
  <polygon points="320,145 350,120 380,145" fill="white" opacity="0.5"/>
  <text x="350" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Fake photos, art</text>
  <text x="350" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Manipulated evidence</text>
  <rect x="270" y="190" width="160" height="18" rx="3" fill="white" opacity="0.2"/>
  <text x="350" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">DALL-E, Midjourney, SD</text>

  <!-- Audio Generation -->
  <rect x="470" y="60" width="200" height="150" rx="10" fill="#22c55e" opacity="0.9"/>
  <text x="570" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">AUDIO</text>
  <line x1="520" y1="120" x2="530" y2="110" stroke="white" stroke-width="3"/>
  <line x1="530" y1="110" x2="545" y2="130" stroke="white" stroke-width="3"/>
  <line x1="545" y1="130" x2="560" y2="105" stroke="white" stroke-width="3"/>
  <line x1="560" y1="105" x2="575" y2="125" stroke="white" stroke-width="3"/>
  <line x1="575" y1="125" x2="590" y2="115" stroke="white" stroke-width="3"/>
  <line x1="590" y1="115" x2="605" y2="120" stroke="white" stroke-width="3"/>
  <text x="570" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Voice cloning</text>
  <text x="570" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Fake phone calls</text>
  <rect x="490" y="185" width="160" height="18" rx="3" fill="white" opacity="0.2"/>
  <text x="570" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">ElevenLabs, Resemble</text>

  <!-- Video Generation -->
  <rect x="140" y="230" width="200" height="150" rx="10" fill="#ef4444" opacity="0.9"/>
  <text x="240" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">VIDEO</text>
  <rect x="200" y="270" width="80" height="50" rx="5" fill="white" opacity="0.3"/>
  <polygon points="225,280 225,310 255,295" fill="white" opacity="0.7"/>
  <text x="240" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Deepfakes, face swaps</text>
  <text x="240" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Synthetic footage</text>
  <rect x="160" y="365" width="160" height="18" rx="3" fill="white" opacity="0.2"/>
  <text x="240" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">Sora, Runway, Synthesia</text>

  <!-- Combined/Hybrid -->
  <rect x="360" y="230" width="200" height="150" rx="10" fill="#f59e0b" opacity="0.9"/>
  <text x="460" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">HYBRID</text>
  <text x="460" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="white">+</text>
  <text x="460" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Multiple AI types combined</text>
  <text x="460" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">AI + human editing</text>
  <text x="460" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Coordinated campaigns</text>
  <rect x="380" y="365" width="160" height="18" rx="3" fill="white" opacity="0.2"/>
  <text x="460" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">Most sophisticated threats</text>
</svg>