<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <filter id="algoShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="algoArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Algorithmic Amplification</text>
  <text x="400" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">How platform algorithms shape what we see</text>

  <!-- Input signals -->
  <g filter="url(#algoShadow)" transform="translate(30, 70)">
    <rect width="180" height="180" rx="12" fill="white" stroke="#fde68a" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Input Signals</text>

    <g transform="translate(15, 40)">
      <rect width="150" height="25" rx="4" fill="#fef3c7"/>
      <text x="75" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#92400e">Engagement (likes, shares)</text>
    </g>

    <g transform="translate(15, 72)">
      <rect width="150" height="25" rx="4" fill="#fef3c7"/>
      <text x="75" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#92400e">Time spent viewing</text>
    </g>

    <g transform="translate(15, 104)">
      <rect width="150" height="25" rx="4" fill="#fef3c7"/>
      <text x="75" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#92400e">User preferences</text>
    </g>

    <g transform="translate(15, 136)">
      <rect width="150" height="25" rx="4" fill="#fef3c7"/>
      <text x="75" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#92400e">Social connections</text>
    </g>
  </g>

  <!-- Arrow to algorithm -->
  <line x1="215" y1="160" x2="270" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#algoArrow)"/>

  <!-- Algorithm box -->
  <g filter="url(#algoShadow)" transform="translate(280, 90)">
    <rect width="240" height="140" rx="16" fill="white" stroke="#8b5cf6" stroke-width="3"/>
    <rect width="240" height="35" rx="16" fill="#8b5cf6"/>
    <rect width="240" height="10" y="25" fill="#8b5cf6"/>
    <text x="120" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">🤖 ALGORITHM</text>

    <text x="120" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b21b6">Optimizes for:</text>

    <g transform="translate(20, 70)">
      <rect width="95" height="50" rx="6" fill="#f3e8ff"/>
      <text x="47" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#5b21b6">Engagement</text>
      <text x="47" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#7c3aed">Keep users</text>
      <text x="47" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#7c3aed">on platform</text>
    </g>

    <g transform="translate(125, 70)">
      <rect width="95" height="50" rx="6" fill="#f3e8ff"/>
      <text x="47" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#5b21b6">Revenue</text>
      <text x="47" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#7c3aed">More ads</text>
      <text x="47" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#7c3aed">viewed</text>
    </g>
  </g>

  <!-- Arrow from algorithm -->
  <line x1="525" y1="160" x2="580" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#algoArrow)"/>

  <!-- Output effects -->
  <g filter="url(#algoShadow)" transform="translate(590, 70)">
    <rect width="180" height="180" rx="12" fill="white" stroke="#fecaca" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Effects</text>

    <g transform="translate(15, 40)">
      <rect width="150" height="25" rx="4" fill="#fef2f2"/>
      <text x="75" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b">Emotional content boosted</text>
    </g>

    <g transform="translate(15, 72)">
      <rect width="150" height="25" rx="4" fill="#fef2f2"/>
      <text x="75" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b">Outrage spreads faster</text>
    </g>

    <g transform="translate(15, 104)">
      <rect width="150" height="25" rx="4" fill="#fef2f2"/>
      <text x="75" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b">Filter bubbles form</text>
    </g>

    <g transform="translate(15, 136)">
      <rect width="150" height="25" rx="4" fill="#fef2f2"/>
      <text x="75" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b">Misinfo can be amplified</text>
    </g>
  </g>

  <!-- Key insight -->
  <g filter="url(#algoShadow)" transform="translate(30, 275)">
    <rect width="740" height="125" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <text x="370" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">The Amplification Problem</text>

    <g transform="translate(20, 35)">
      <rect width="345" height="75" rx="8" fill="#fef2f2"/>
      <text x="172" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#991b1b">Why It Matters</text>
      <text x="15" y="38" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">• False content often gets more engagement</text>
      <text x="15" y="52" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">• Algorithms don't check truth, only engagement</text>
      <text x="15" y="66" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">• Small groups can appear much larger</text>
    </g>

    <g transform="translate(375, 35)">
      <rect width="345" height="75" rx="8" fill="#f0fdf4"/>
      <text x="172" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#166534">Potential Solutions</text>
      <text x="15" y="38" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Reduce algorithmic amplification of misinfo</text>
      <text x="15" y="52" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Add friction before sharing</text>
      <text x="15" y="66" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Transparency about recommendation systems</text>
    </g>
  </g>
</svg>
