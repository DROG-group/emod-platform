<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <filter id="regShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Platform Regulation Approaches</text>
  <text x="400" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Different models for governing online platforms</text>

  <!-- Spectrum bar -->
  <g transform="translate(50, 65)">
    <rect width="700" height="25" rx="12" fill="#e2e8f0"/>
    <rect width="233" height="25" rx="12" fill="#ef4444" x="0"/>
    <rect width="234" height="25" fill="#f59e0b" x="233"/>
    <rect width="233" height="25" rx="12" fill="#10b981" x="467"/>

    <text x="116" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="white">SELF-REGULATION</text>
    <text x="350" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="white">CO-REGULATION</text>
    <text x="583" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="white">STATUTORY</text>
  </g>

  <!-- Self-regulation -->
  <g filter="url(#regShadow)" transform="translate(30, 105)">
    <rect width="235" height="165" rx="12" fill="white" stroke="#fecaca" stroke-width="2"/>
    <text x="117" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Platform Self-Regulation</text>

    <text x="15" y="50" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">• Platforms set own rules</text>
    <text x="15" y="65" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">• Voluntary commitments</text>
    <text x="15" y="80" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">• Industry codes of conduct</text>

    <rect x="15" y="95" width="205" height="55" rx="6" fill="#fef2f2"/>
    <text x="117" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#991b1b">Pros &amp; Cons</text>
    <text x="20" y="128" font-family="system-ui, sans-serif" font-size="7" fill="#b91c1c">+ Flexible, fast to adapt</text>
    <text x="20" y="141" font-family="system-ui, sans-serif" font-size="7" fill="#b91c1c">- Limited accountability</text>
  </g>

  <!-- Co-regulation -->
  <g filter="url(#regShadow)" transform="translate(282, 105)">
    <rect width="235" height="165" rx="12" fill="white" stroke="#fde68a" stroke-width="2"/>
    <text x="117" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Co-Regulation</text>

    <text x="15" y="50" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">• Government sets goals</text>
    <text x="15" y="65" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">• Industry designs implementation</text>
    <text x="15" y="80" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">• Shared oversight bodies</text>

    <rect x="15" y="95" width="205" height="55" rx="6" fill="#fef3c7"/>
    <text x="117" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#92400e">Pros &amp; Cons</text>
    <text x="20" y="128" font-family="system-ui, sans-serif" font-size="7" fill="#b45309">+ Balances flexibility &amp; oversight</text>
    <text x="20" y="141" font-family="system-ui, sans-serif" font-size="7" fill="#b45309">- Can be slow, compromised</text>
  </g>

  <!-- Statutory regulation -->
  <g filter="url(#regShadow)" transform="translate(534, 105)">
    <rect width="235" height="165" rx="12" fill="white" stroke="#86efac" stroke-width="2"/>
    <text x="117" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#166534">Statutory Regulation</text>

    <text x="15" y="50" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Laws set requirements</text>
    <text x="15" y="65" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Government enforcement</text>
    <text x="15" y="80" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Penalties for non-compliance</text>

    <rect x="15" y="95" width="205" height="55" rx="6" fill="#f0fdf4"/>
    <text x="117" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#166534">Pros &amp; Cons</text>
    <text x="20" y="128" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">+ Clear rules, accountability</text>
    <text x="20" y="141" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">- Risk of overreach, slow</text>
  </g>

  <!-- Examples -->
  <g filter="url(#regShadow)" transform="translate(30, 290)">
    <rect width="740" height="110" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <text x="370" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Real-World Examples</text>

    <g transform="translate(20, 35)">
      <rect width="220" height="60" rx="8" fill="#fef2f2"/>
      <text x="110" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#991b1b">US Approach</text>
      <text x="110" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#dc2626">Mostly self-regulation</text>
      <text x="110" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#dc2626">Section 230 immunity</text>
    </g>

    <g transform="translate(260, 35)">
      <rect width="220" height="60" rx="8" fill="#fef3c7"/>
      <text x="110" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#92400e">EU Code of Practice</text>
      <text x="110" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#b45309">Voluntary commitments</text>
      <text x="110" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#b45309">Moving toward DSA</text>
    </g>

    <g transform="translate(500, 35)">
      <rect width="220" height="60" rx="8" fill="#f0fdf4"/>
      <text x="110" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#166534">EU DSA</text>
      <text x="110" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">Statutory requirements</text>
      <text x="110" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">Risk assessments, audits</text>
    </g>
  </g>
</svg>
