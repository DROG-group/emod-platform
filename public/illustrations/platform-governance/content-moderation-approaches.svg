<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <filter id="platShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Content Moderation Approaches</text>
  <text x="400" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Different tools platforms use to address harmful content</text>

  <!-- Spectrum bar -->
  <g transform="translate(50, 65)">
    <rect width="700" height="25" rx="12" fill="#e2e8f0"/>
    <rect width="175" height="25" rx="12" fill="#ef4444" x="0"/>
    <rect width="175" height="25" fill="#f59e0b" x="175"/>
    <rect width="175" height="25" fill="#10b981" x="350"/>
    <rect width="175" height="25" rx="12" fill="#3b82f6" x="525"/>

    <text x="87" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="white">REMOVAL</text>
    <text x="262" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="white">REDUCTION</text>
    <text x="437" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="white">LABELING</text>
    <text x="612" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="white">CONTEXT</text>
  </g>

  <!-- Removal -->
  <g filter="url(#platShadow)" transform="translate(30, 105)">
    <rect width="175" height="150" rx="12" fill="white" stroke="#fecaca" stroke-width="2"/>
    <text x="87" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Remove Content</text>

    <text x="15" y="50" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">• Delete posts</text>
    <text x="15" y="65" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">• Suspend accounts</text>
    <text x="15" y="80" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">• Ban users</text>

    <rect x="10" y="95" width="155" height="45" rx="6" fill="#fef2f2"/>
    <text x="87" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#991b1b">Most restrictive</text>
    <text x="87" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#b91c1c">Risk: Censorship concerns</text>
    <text x="87" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#b91c1c">Use: Clear policy violations</text>
  </g>

  <!-- Reduction -->
  <g filter="url(#platShadow)" transform="translate(220, 105)">
    <rect width="175" height="150" rx="12" fill="white" stroke="#fde68a" stroke-width="2"/>
    <text x="87" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Reduce Spread</text>

    <text x="15" y="50" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">• Downrank in algorithm</text>
    <text x="15" y="65" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">• Remove from recommend</text>
    <text x="15" y="80" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">• Limit sharing</text>

    <rect x="10" y="95" width="155" height="45" rx="6" fill="#fef3c7"/>
    <text x="87" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#92400e">Less visible approach</text>
    <text x="87" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#b45309">Risk: Lack of transparency</text>
    <text x="87" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#b45309">Use: Borderline content</text>
  </g>

  <!-- Labeling -->
  <g filter="url(#platShadow)" transform="translate(410, 105)">
    <rect width="175" height="150" rx="12" fill="white" stroke="#86efac" stroke-width="2"/>
    <text x="87" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#166534">Add Labels</text>

    <text x="15" y="50" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Fact-check labels</text>
    <text x="15" y="65" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Source labels</text>
    <text x="15" y="80" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Warning labels</text>

    <rect x="10" y="95" width="155" height="45" rx="6" fill="#f0fdf4"/>
    <text x="87" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#166534">Keeps content visible</text>
    <text x="87" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">Risk: May legitimize</text>
    <text x="87" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">Use: Disputed claims</text>
  </g>

  <!-- Context -->
  <g filter="url(#platShadow)" transform="translate(600, 105)">
    <rect width="175" height="150" rx="12" fill="white" stroke="#93c5fd" stroke-width="2"/>
    <text x="87" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Add Context</text>

    <text x="15" y="50" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Community notes</text>
    <text x="15" y="65" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Related articles</text>
    <text x="15" y="80" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Information panels</text>

    <rect x="10" y="95" width="155" height="45" rx="6" fill="#eff6ff"/>
    <text x="87" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#1e40af">Least restrictive</text>
    <text x="87" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#3b82f6">Risk: Users may ignore</text>
    <text x="87" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#3b82f6">Use: Complex issues</text>
  </g>

  <!-- Key insight -->
  <g filter="url(#platShadow)" transform="translate(30, 275)">
    <rect width="740" height="125" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <text x="370" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">The Moderation Dilemma</text>

    <g transform="translate(20, 40)">
      <rect width="345" height="70" rx="8" fill="#fef2f2"/>
      <text x="172" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#991b1b">Under-moderation Risks</text>
      <text x="15" y="38" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">• Harmful content spreads unchecked</text>
      <text x="15" y="52" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">• Platform becomes toxic</text>
      <text x="15" y="66" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">• Real-world harm from online content</text>
    </g>

    <g transform="translate(375, 40)">
      <rect width="345" height="70" rx="8" fill="#eff6ff"/>
      <text x="172" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1e40af">Over-moderation Risks</text>
      <text x="15" y="38" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Legitimate speech suppressed</text>
      <text x="15" y="52" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Bias in enforcement</text>
      <text x="15" y="66" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Chilling effect on expression</text>
    </g>
  </g>
</svg>