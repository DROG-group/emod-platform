<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
  <defs>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1f2937">Evidence Ladder: Signal Classification</text>

  <!-- Strong signals - top -->
  <g filter="url(#shadow2)">
    <rect x="50" y="60" width="600" height="80" rx="12" fill="#dcfce7"/>
    <rect x="50" y="60" width="8" height="80" rx="4" fill="#16a34a"/>
    <text x="80" y="90" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#166534">Strong Signals</text>
    <text x="80" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563">• Coordinated timing (seconds apart) across many accounts</text>
    <text x="80" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563">• Account creation clustering around campaign start</text>
    <text x="400" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563">• Cross-platform identical deployment</text>
    <text x="400" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563">• Network isolation (internal engagement only)</text>
    <circle cx="620" cy="100" r="20" fill="#16a34a"/>
    <text x="620" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">High</text>
  </g>

  <!-- Medium signals - middle -->
  <g filter="url(#shadow2)">
    <rect x="50" y="155" width="600" height="80" rx="12" fill="#fef9c3"/>
    <rect x="50" y="155" width="8" height="80" rx="4" fill="#ca8a04"/>
    <text x="80" y="185" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#854d0e">Medium Signals</text>
    <text x="80" y="205" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563">• Volume spike without clear trigger</text>
    <text x="80" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563">• Elevated new account participation</text>
    <text x="350" y="205" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563">• Similar messaging patterns</text>
    <text x="350" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563">• Unusual engagement ratios</text>
    <circle cx="620" cy="195" r="20" fill="#ca8a04"/>
    <text x="620" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">Med</text>
  </g>

  <!-- Weak signals - bottom -->
  <g filter="url(#shadow2)">
    <rect x="50" y="250" width="600" height="80" rx="12" fill="#fee2e2"/>
    <rect x="50" y="250" width="8" height="80" rx="4" fill="#dc2626"/>
    <text x="80" y="280" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#991b1b">Weak Signals</text>
    <text x="80" y="300" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563">• Rapid spread (real content spreads fast too)</text>
    <text x="80" y="315" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563">• Emotional language (genuine outrage exists)</text>
    <text x="380" y="300" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563">• "Feels coordinated" without specifics</text>
    <text x="380" y="315" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563">• Low-follower accounts (most people)</text>
    <circle cx="620" cy="290" r="20" fill="#dc2626"/>
    <text x="620" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">Low</text>
  </g>
</svg>
