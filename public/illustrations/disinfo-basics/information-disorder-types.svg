<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <defs>
    <filter id="disShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Information Disorder: Three Types</text>
  <text x="400" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Different problems require different solutions</text>

  <!-- Misinformation -->
  <g filter="url(#disShadow)" transform="translate(30, 70)">
    <rect width="235" height="280" rx="16" fill="white" stroke="#fde68a" stroke-width="2"/>
    <rect width="235" height="45" rx="16" fill="#f59e0b"/>
    <rect width="235" height="20" y="25" fill="#f59e0b"/>
    <text x="117" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">MISINFORMATION</text>

    <text x="117" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#92400e">False + Unintentional</text>

    <!-- Visual representation -->
    <g transform="translate(77, 85)">
      <circle cx="40" cy="30" r="25" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
      <text x="40" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#92400e">False</text>
      <text x="40" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#92400e">Info</text>
      <path d="M25,60 Q40,70 55,60" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <text x="40" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#b45309">Shared believing it's true</text>
    </g>

    <text x="20" y="180" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#92400e">Examples:</text>
    <text x="25" y="196" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">• Grandma shares health myth</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">• Misremembered facts</text>
    <text x="25" y="224" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">• Satire taken seriously</text>

    <rect x="15" y="240" width="205" height="30" rx="6" fill="#fffbeb"/>
    <text x="117" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#92400e">Response: Gentle correction</text>
  </g>

  <!-- Disinformation -->
  <g filter="url(#disShadow)" transform="translate(282, 70)">
    <rect width="235" height="280" rx="16" fill="white" stroke="#fecaca" stroke-width="2"/>
    <rect width="235" height="45" rx="16" fill="#ef4444"/>
    <rect width="235" height="20" y="25" fill="#ef4444"/>
    <text x="117" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">DISINFORMATION</text>

    <text x="117" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#991b1b">False + Intentional</text>

    <!-- Visual representation -->
    <g transform="translate(77, 85)">
      <circle cx="40" cy="30" r="25" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
      <text x="40" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b">False</text>
      <text x="40" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b">Info</text>
      <path d="M25,60 L40,75 L55,60" fill="none" stroke="#ef4444" stroke-width="2"/>
      <text x="40" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#991b1b">Created/shared to deceive</text>
    </g>

    <text x="20" y="180" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#991b1b">Examples:</text>
    <text x="25" y="196" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">• State propaganda campaigns</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">• Fabricated news stories</text>
    <text x="25" y="224" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">• Coordinated influence ops</text>

    <rect x="15" y="240" width="205" height="30" rx="6" fill="#fef2f2"/>
    <text x="117" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b">Response: Counter + disrupt</text>
  </g>

  <!-- Malinformation -->
  <g filter="url(#disShadow)" transform="translate(534, 70)">
    <rect width="235" height="280" rx="16" fill="white" stroke="#c4b5fd" stroke-width="2"/>
    <rect width="235" height="45" rx="16" fill="#8b5cf6"/>
    <rect width="235" height="20" y="25" fill="#8b5cf6"/>
    <text x="117" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">MALINFORMATION</text>

    <text x="117" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#5b21b6">True + Harmful Intent</text>

    <!-- Visual representation -->
    <g transform="translate(77, 85)">
      <circle cx="40" cy="30" r="25" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2"/>
      <text x="40" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b21b6">True</text>
      <text x="40" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b21b6">Info</text>
      <path d="M20,60 L40,50 L60,60" fill="none" stroke="#8b5cf6" stroke-width="2"/>
      <text x="40" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#5b21b6">Shared to cause harm</text>
    </g>

    <text x="20" y="180" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#5b21b6">Examples:</text>
    <text x="25" y="196" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">• Leaked private info (doxxing)</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">• Out-of-context truths</text>
    <text x="25" y="224" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">• Weaponized disclosures</text>

    <rect x="15" y="240" width="205" height="30" rx="6" fill="#f3e8ff"/>
    <text x="117" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b21b6">Response: Context + ethics</text>
  </g>
</svg>