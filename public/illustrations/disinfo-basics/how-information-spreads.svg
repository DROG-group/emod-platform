<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <filter id="spreadShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="spreadArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">How Information Spreads Online</text>
  <text x="400" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Understanding viral dynamics</text>

  <!-- Origin -->
  <g filter="url(#spreadShadow)" transform="translate(30, 70)">
    <circle cx="50" cy="50" r="40" fill="#ef4444"/>
    <text x="50" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white">ORIGIN</text>
    <text x="50" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="white">Source</text>

    <text x="50" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b">Single post or</text>
    <text x="50" y="127" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b">coordinated seed</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="125" y1="120" x2="170" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#spreadArrow)"/>

  <!-- Early Amplification -->
  <g filter="url(#spreadShadow)" transform="translate(180, 70)">
    <rect width="140" height="100" rx="12" fill="white" stroke="#fde68a" stroke-width="2"/>
    <text x="70" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#92400e">EARLY SPREAD</text>

    <circle cx="35" cy="55" r="12" fill="#fbbf24"/>
    <circle cx="70" cy="45" r="10" fill="#fcd34d"/>
    <circle cx="105" cy="55" r="12" fill="#fbbf24"/>
    <circle cx="55" cy="75" r="8" fill="#fde68a"/>
    <circle cx="85" cy="75" r="8" fill="#fde68a"/>

    <text x="70" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#92400e">Key amplifiers</text>
    <text x="70" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#92400e">pick up content</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="325" y1="120" x2="370" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#spreadArrow)"/>

  <!-- Viral Spread -->
  <g filter="url(#spreadShadow)" transform="translate(380, 55)">
    <rect width="180" height="130" rx="12" fill="white" stroke="#86efac" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#166534">VIRAL SPREAD</text>

    <!-- Network visualization -->
    <g transform="translate(90, 70)">
      <circle cx="0" cy="0" r="8" fill="#22c55e"/>
      <circle cx="-35" cy="-20" r="6" fill="#4ade80"/>
      <circle cx="-40" cy="15" r="5" fill="#86efac"/>
      <circle cx="35" cy="-20" r="6" fill="#4ade80"/>
      <circle cx="40" cy="15" r="5" fill="#86efac"/>
      <circle cx="-20" cy="35" r="5" fill="#86efac"/>
      <circle cx="20" cy="35" r="5" fill="#86efac"/>
      <circle cx="-55" cy="-5" r="4" fill="#bbf7d0"/>
      <circle cx="55" cy="-5" r="4" fill="#bbf7d0"/>
      <circle cx="-60" cy="-30" r="3" fill="#dcfce7"/>
      <circle cx="60" cy="-30" r="3" fill="#dcfce7"/>

      <line x1="0" y1="0" x2="-35" y2="-20" stroke="#86efac" stroke-width="1"/>
      <line x1="0" y1="0" x2="35" y2="-20" stroke="#86efac" stroke-width="1"/>
      <line x1="0" y1="0" x2="-40" y2="15" stroke="#86efac" stroke-width="1"/>
      <line x1="0" y1="0" x2="40" y2="15" stroke="#86efac" stroke-width="1"/>
      <line x1="-35" y1="-20" x2="-55" y2="-5" stroke="#bbf7d0" stroke-width="1"/>
      <line x1="35" y1="-20" x2="55" y2="-5" stroke="#bbf7d0" stroke-width="1"/>
    </g>

    <text x="90" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#166534">Exponential growth</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="565" y1="120" x2="610" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#spreadArrow)"/>

  <!-- Mainstream -->
  <g filter="url(#spreadShadow)" transform="translate(620, 70)">
    <rect width="150" height="100" rx="12" fill="white" stroke="#93c5fd" stroke-width="2"/>
    <text x="75" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#1e40af">MAINSTREAM</text>

    <rect x="20" y="40" width="50" height="30" rx="4" fill="#dbeafe"/>
    <text x="45" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#1e40af">News</text>

    <rect x="80" y="40" width="50" height="30" rx="4" fill="#dbeafe"/>
    <text x="105" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#1e40af">TV</text>

    <text x="75" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#1e40af">Traditional media</text>
    <text x="75" y="107" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#1e40af">picks up story</text>
  </g>

  <!-- Amplification factors -->
  <g filter="url(#spreadShadow)" transform="translate(30, 210)">
    <rect width="740" height="180" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <text x="370" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">What Makes Content Spread</text>

    <!-- Factors grid -->
    <g transform="translate(20, 40)">
      <rect width="170" height="60" rx="8" fill="#fef2f2"/>
      <text x="85" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#991b1b">Emotional Triggers</text>
      <text x="85" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">Anger, fear, outrage</text>
      <text x="85" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">spread fastest</text>
    </g>

    <g transform="translate(200, 40)">
      <rect width="170" height="60" rx="8" fill="#f3e8ff"/>
      <text x="85" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#5b21b6">Identity &amp; Belonging</text>
      <text x="85" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">Content that signals</text>
      <text x="85" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">group membership</text>
    </g>

    <g transform="translate(380, 40)">
      <rect width="170" height="60" rx="8" fill="#eff6ff"/>
      <text x="85" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1e40af">Social Proof</text>
      <text x="85" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">Already popular =</text>
      <text x="85" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">more likely to share</text>
    </g>

    <g transform="translate(560, 40)">
      <rect width="170" height="60" rx="8" fill="#fef3c7"/>
      <text x="85" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#92400e">Simplicity</text>
      <text x="85" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">Simple narratives beat</text>
      <text x="85" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">complex truths</text>
    </g>

    <!-- Key insight -->
    <rect x="20" y="115" width="700" height="50" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="370" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#166534">Key insight: Falsehoods often spread faster than truth because they're optimized for sharing,</text>
    <text x="370" y="153" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">not accuracy. Truth is constrained by reality; lies can be crafted for maximum engagement.</text>
  </g>
</svg>