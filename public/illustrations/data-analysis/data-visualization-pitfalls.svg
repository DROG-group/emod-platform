<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <filter id="vizShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Data Visualization Pitfalls</text>
  <text x="400" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">How charts can mislead — and how to spot it</text>

  <!-- Truncated Y-axis -->
  <g filter="url(#vizShadow)" transform="translate(30, 70)">
    <rect width="235" height="170" rx="12" fill="white" stroke="#fecaca" stroke-width="2"/>
    <text x="117" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">🚩 Truncated Y-Axis</text>

    <!-- Bad chart -->
    <g transform="translate(20, 35)">
      <rect width="85" height="80" rx="4" fill="#fef2f2"/>
      <text x="42" y="12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#991b1b">Misleading</text>

      <!-- Y axis starting at 95 -->
      <text x="8" y="25" font-family="system-ui, sans-serif" font-size="5" fill="#64748b">100</text>
      <text x="8" y="50" font-family="system-ui, sans-serif" font-size="5" fill="#64748b">97</text>
      <text x="8" y="75" font-family="system-ui, sans-serif" font-size="5" fill="#64748b">95</text>

      <rect x="25" y="25" width="20" height="45" fill="#ef4444"/>
      <rect x="55" y="60" width="20" height="10" fill="#ef4444"/>

      <text x="35" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="5" fill="#64748b">A</text>
      <text x="65" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="5" fill="#64748b">B</text>
    </g>

    <!-- Good chart -->
    <g transform="translate(120, 35)">
      <rect width="95" height="80" rx="4" fill="#f0fdf4"/>
      <text x="47" y="12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#166534">Accurate</text>

      <!-- Y axis starting at 0 -->
      <text x="8" y="25" font-family="system-ui, sans-serif" font-size="5" fill="#64748b">100</text>
      <text x="8" y="50" font-family="system-ui, sans-serif" font-size="5" fill="#64748b">50</text>
      <text x="8" y="75" font-family="system-ui, sans-serif" font-size="5" fill="#64748b">0</text>

      <rect x="30" y="20" width="20" height="55" fill="#22c55e"/>
      <rect x="60" y="22" width="20" height="53" fill="#22c55e"/>
    </g>

    <rect x="15" y="125" width="205" height="35" rx="6" fill="#fef2f2"/>
    <text x="117" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#991b1b">Small difference (97 vs 96) looks huge</text>
    <text x="117" y="154" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#991b1b">when axis doesn't start at zero</text>
  </g>

  <!-- Cherry-picked timeframe -->
  <g filter="url(#vizShadow)" transform="translate(282, 70)">
    <rect width="235" height="170" rx="12" fill="white" stroke="#fde68a" stroke-width="2"/>
    <text x="117" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#92400e">🚩 Cherry-Picked Timeframe</text>

    <!-- Full timeline -->
    <g transform="translate(20, 38)">
      <rect width="195" height="50" rx="4" fill="#f8fafc"/>
      <text x="97" y="12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#475569">Full Data</text>

      <!-- Line chart showing overall trend -->
      <polyline points="15,40 45,35 75,38 105,32 135,25 165,20 180,18" fill="none" stroke="#64748b" stroke-width="1.5"/>

      <!-- Highlighted misleading section -->
      <rect x="105" y="18" width="40" height="27" fill="#fef3c7" fill-opacity="0.5" stroke="#f59e0b" stroke-dasharray="2"/>
    </g>

    <!-- Zoomed misleading view -->
    <g transform="translate(20, 95)">
      <rect width="195" height="35" rx="4" fill="#fef3c7"/>
      <text x="15" y="14" font-family="system-ui, sans-serif" font-size="6" fill="#92400e">Zoomed: "Prices falling!"</text>
      <polyline points="15,30 50,25 85,28 120,22 155,30 180,32" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    </g>

    <rect x="15" y="137" width="205" height="25" rx="6" fill="#fef3c7"/>
    <text x="117" y="153" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#92400e">Selective dates can reverse the narrative</text>
  </g>

  <!-- 3D charts / pie charts -->
  <g filter="url(#vizShadow)" transform="translate(534, 70)">
    <rect width="235" height="170" rx="12" fill="white" stroke="#c4b5fd" stroke-width="2"/>
    <text x="117" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#5b21b6">🚩 Distorting Chart Types</text>

    <g transform="translate(20, 35)">
      <rect width="90" height="75" rx="4" fill="#f3e8ff"/>
      <text x="45" y="12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#5b21b6">3D Pie Chart</text>

      <!-- Distorted 3D pie representation -->
      <ellipse cx="45" cy="50" rx="35" ry="15" fill="#a78bfa"/>
      <ellipse cx="45" cy="45" rx="35" ry="15" fill="#c4b5fd"/>
      <text x="45" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="6" fill="#5b21b6">Back slices look smaller</text>
    </g>

    <g transform="translate(120, 35)">
      <rect width="95" height="75" rx="4" fill="#f3e8ff"/>
      <text x="47" y="12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#5b21b6">Scaled Icons</text>

      <!-- Misleading icon scaling -->
      <text x="25" y="50" font-family="system-ui, sans-serif" font-size="18" fill="#7c3aed">👤</text>
      <text x="55" y="50" font-family="system-ui, sans-serif" font-size="30" fill="#7c3aed">👤</text>

      <text x="47" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="6" fill="#5b21b6">2x height = 4x area</text>
    </g>

    <rect x="15" y="120" width="205" height="40" rx="6" fill="#f3e8ff"/>
    <text x="117" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#5b21b6">3D effects and scaled icons distort</text>
    <text x="117" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#5b21b6">proportions. Prefer flat 2D charts.</text>
  </g>

  <!-- What to check -->
  <g filter="url(#vizShadow)" transform="translate(30, 260)">
    <rect width="740" height="140" rx="12" fill="white" stroke="#86efac" stroke-width="2"/>
    <text x="370" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#166534">✅ Chart Verification Checklist</text>

    <g transform="translate(20, 40)">
      <rect width="170" height="85" rx="8" fill="#f0fdf4"/>
      <text x="85" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#166534">Axis Check</text>
      <text x="15" y="38" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">□ Does Y-axis start at zero?</text>
      <text x="15" y="52" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">□ Are increments even?</text>
      <text x="15" y="66" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">□ Is the scale appropriate?</text>
    </g>

    <g transform="translate(200, 40)">
      <rect width="170" height="85" rx="8" fill="#f0fdf4"/>
      <text x="85" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#166534">Time Check</text>
      <text x="15" y="38" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">□ What timeframe is shown?</text>
      <text x="15" y="52" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">□ Why these dates?</text>
      <text x="15" y="66" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">□ What happens outside?</text>
    </g>

    <g transform="translate(380, 40)">
      <rect width="170" height="85" rx="8" fill="#f0fdf4"/>
      <text x="85" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#166534">Source Check</text>
      <text x="15" y="38" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">□ Where's the data from?</text>
      <text x="15" y="52" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">□ Who made this chart?</text>
      <text x="15" y="66" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">□ Can I verify the numbers?</text>
    </g>

    <g transform="translate(560, 40)">
      <rect width="170" height="85" rx="8" fill="#f0fdf4"/>
      <text x="85" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#166534">Context Check</text>
      <text x="15" y="38" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">□ What's the full story?</text>
      <text x="15" y="52" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">□ What's being omitted?</text>
      <text x="15" y="66" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">□ Does the narrative match?</text>
    </g>
  </g>
</svg>
