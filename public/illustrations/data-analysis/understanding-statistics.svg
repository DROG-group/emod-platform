<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <filter id="statShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Understanding Basic Statistics</text>
  <text x="400" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Key concepts for evaluating data claims</text>

  <!-- Mean, Median, Mode -->
  <g filter="url(#statShadow)" transform="translate(30, 70)">
    <rect width="235" height="160" rx="12" fill="white" stroke="#93c5fd" stroke-width="2"/>
    <text x="117" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Central Tendency</text>

    <g transform="translate(15, 40)">
      <rect width="205" height="35" rx="6" fill="#eff6ff"/>
      <text x="15" y="15" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1e40af">Mean (Average)</text>
      <text x="15" y="28" font-family="system-ui, sans-serif" font-size="7" fill="#3b82f6">Sum of values ÷ count</text>
    </g>

    <g transform="translate(15, 82)">
      <rect width="205" height="35" rx="6" fill="#eff6ff"/>
      <text x="15" y="15" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1e40af">Median (Middle)</text>
      <text x="15" y="28" font-family="system-ui, sans-serif" font-size="7" fill="#3b82f6">Middle value when sorted</text>
    </g>

    <g transform="translate(15, 124)">
      <rect width="205" height="28" rx="6" fill="#fef3c7"/>
      <text x="103" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#92400e">⚠️ Outliers affect mean but not median</text>
    </g>
  </g>

  <!-- Sample size -->
  <g filter="url(#statShadow)" transform="translate(282, 70)">
    <rect width="235" height="160" rx="12" fill="white" stroke="#86efac" stroke-width="2"/>
    <text x="117" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#166534">Sample Size Matters</text>

    <g transform="translate(15, 45)">
      <rect width="90" height="70" rx="6" fill="#fef2f2"/>
      <text x="45" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#991b1b">Small n=10</text>
      <text x="45" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#dc2626">High variance</text>
      <text x="45" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#dc2626">Less reliable</text>
      <text x="45" y="61" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#dc2626">⚠️ Caution</text>
    </g>

    <g transform="translate(115, 45)">
      <rect width="105" height="70" rx="6" fill="#f0fdf4"/>
      <text x="52" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#166534">Large n=1000+</text>
      <text x="52" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">Low variance</text>
      <text x="52" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">More reliable</text>
      <text x="52" y="61" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">✓ Trustworthy</text>
    </g>

    <rect x="15" y="124" width="205" height="28" rx="6" fill="#eff6ff"/>
    <text x="117" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#1e40af">Always ask: How many were surveyed?</text>
  </g>

  <!-- Correlation vs causation -->
  <g filter="url(#statShadow)" transform="translate(534, 70)">
    <rect width="235" height="160" rx="12" fill="white" stroke="#fecaca" stroke-width="2"/>
    <text x="117" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Correlation ≠ Causation</text>

    <g transform="translate(15, 42)">
      <rect width="205" height="45" rx="6" fill="#fef2f2"/>
      <text x="103" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#991b1b">Common Mistake</text>
      <text x="103" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#dc2626">"Ice cream sales ↑ = drowning deaths ↑"</text>
      <text x="103" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#dc2626">Both caused by summer (third variable)</text>
    </g>

    <g transform="translate(15, 95)">
      <rect width="205" height="55" rx="6" fill="#f0fdf4"/>
      <text x="103" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#166534">What to Look For</text>
      <text x="15" y="32" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">• Was there a controlled experiment?</text>
      <text x="15" y="45" font-family="system-ui, sans-serif" font-size="7" fill="#15803d">• Could something else explain it?</text>
    </g>
  </g>

  <!-- Red flags in stats -->
  <g filter="url(#statShadow)" transform="translate(30, 250)">
    <rect width="740" height="150" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <text x="370" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">🚩 Red Flags in Statistical Claims</text>

    <g transform="translate(20, 40)">
      <rect width="170" height="95" rx="8" fill="#fef2f2"/>
      <text x="85" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#991b1b">Missing Context</text>
      <text x="15" y="38" font-family="system-ui, sans-serif" font-size="7" fill="#dc2626">• No sample size given</text>
      <text x="15" y="52" font-family="system-ui, sans-serif" font-size="7" fill="#dc2626">• No margin of error</text>
      <text x="15" y="66" font-family="system-ui, sans-serif" font-size="7" fill="#dc2626">• No comparison baseline</text>
      <text x="15" y="80" font-family="system-ui, sans-serif" font-size="7" fill="#dc2626">• No time period</text>
    </g>

    <g transform="translate(200, 40)">
      <rect width="170" height="95" rx="8" fill="#fef3c7"/>
      <text x="85" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#92400e">Cherry-Picking</text>
      <text x="15" y="38" font-family="system-ui, sans-serif" font-size="7" fill="#b45309">• Unusual time ranges</text>
      <text x="15" y="52" font-family="system-ui, sans-serif" font-size="7" fill="#b45309">• Selective data points</text>
      <text x="15" y="66" font-family="system-ui, sans-serif" font-size="7" fill="#b45309">• Convenient omissions</text>
      <text x="15" y="80" font-family="system-ui, sans-serif" font-size="7" fill="#b45309">• Truncated axes</text>
    </g>

    <g transform="translate(380, 40)">
      <rect width="170" height="95" rx="8" fill="#f3e8ff"/>
      <text x="85" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#5b21b6">Misleading Framing</text>
      <text x="15" y="38" font-family="system-ui, sans-serif" font-size="7" fill="#7c3aed">• Relative vs absolute risk</text>
      <text x="15" y="52" font-family="system-ui, sans-serif" font-size="7" fill="#7c3aed">• % change vs % points</text>
      <text x="15" y="66" font-family="system-ui, sans-serif" font-size="7" fill="#7c3aed">• Averages hiding range</text>
      <text x="15" y="80" font-family="system-ui, sans-serif" font-size="7" fill="#7c3aed">• Non-representative sample</text>
    </g>

    <g transform="translate(560, 40)">
      <rect width="170" height="95" rx="8" fill="#eff6ff"/>
      <text x="85" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1e40af">Good Questions</text>
      <text x="15" y="38" font-family="system-ui, sans-serif" font-size="7" fill="#3b82f6">• Who conducted the study?</text>
      <text x="15" y="52" font-family="system-ui, sans-serif" font-size="7" fill="#3b82f6">• How was data collected?</text>
      <text x="15" y="66" font-family="system-ui, sans-serif" font-size="7" fill="#3b82f6">• What's the full picture?</text>
      <text x="15" y="80" font-family="system-ui, sans-serif" font-size="7" fill="#3b82f6">• Who funded this?</text>
    </g>
  </g>
</svg>
