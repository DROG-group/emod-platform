<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <filter id="biasShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Cognitive Biases That Affect Belief</text>
  <text x="400" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Mental shortcuts that make us vulnerable to misinformation</text>

  <!-- Brain center visual -->
  <g filter="url(#biasShadow)" transform="translate(320, 80)">
    <ellipse cx="80" cy="60" rx="70" ry="50" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <path d="M45,40 Q60,25 80,30 Q100,25 115,40" fill="none" stroke="#64748b" stroke-width="2"/>
    <path d="M50,70 Q80,85 110,70" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#475569">BRAIN</text>
  </g>

  <!-- Confirmation Bias -->
  <g filter="url(#biasShadow)" transform="translate(30, 180)">
    <rect width="175" height="115" rx="12" fill="white" stroke="#fecaca" stroke-width="2"/>
    <rect width="175" height="30" rx="12" fill="#ef4444"/>
    <rect width="175" height="10" y="20" fill="#ef4444"/>
    <text x="87" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white">Confirmation Bias</text>

    <text x="15" y="50" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">We seek info that confirms</text>
    <text x="15" y="62" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">what we already believe.</text>

    <rect x="15" y="75" width="145" height="30" rx="6" fill="#fef2f2"/>
    <text x="87" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#991b1b">💡 Counter: Actively seek</text>
    <text x="87" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#991b1b">opposing viewpoints</text>
  </g>

  <!-- Availability Heuristic -->
  <g filter="url(#biasShadow)" transform="translate(220, 180)">
    <rect width="175" height="115" rx="12" fill="white" stroke="#fde68a" stroke-width="2"/>
    <rect width="175" height="30" rx="12" fill="#f59e0b"/>
    <rect width="175" height="10" y="20" fill="#f59e0b"/>
    <text x="87" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white">Availability Heuristic</text>

    <text x="15" y="50" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">We overweight memorable</text>
    <text x="15" y="62" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">or recent information.</text>

    <rect x="15" y="75" width="145" height="30" rx="6" fill="#fef3c7"/>
    <text x="87" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#92400e">💡 Counter: Look at actual</text>
    <text x="87" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#92400e">statistics and data</text>
  </g>

  <!-- Bandwagon Effect -->
  <g filter="url(#biasShadow)" transform="translate(410, 180)">
    <rect width="175" height="115" rx="12" fill="white" stroke="#93c5fd" stroke-width="2"/>
    <rect width="175" height="30" rx="12" fill="#3b82f6"/>
    <rect width="175" height="10" y="20" fill="#3b82f6"/>
    <text x="87" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white">Bandwagon Effect</text>

    <text x="15" y="50" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">We believe things because</text>
    <text x="15" y="62" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">many others believe them.</text>

    <rect x="15" y="75" width="145" height="30" rx="6" fill="#eff6ff"/>
    <text x="87" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#1e40af">💡 Counter: Evaluate claims</text>
    <text x="87" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#1e40af">on their own merit</text>
  </g>

  <!-- Anchoring Bias -->
  <g filter="url(#biasShadow)" transform="translate(600, 180)">
    <rect width="175" height="115" rx="12" fill="white" stroke="#86efac" stroke-width="2"/>
    <rect width="175" height="30" rx="12" fill="#10b981"/>
    <rect width="175" height="10" y="20" fill="#10b981"/>
    <text x="87" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white">Anchoring Bias</text>

    <text x="15" y="50" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">First info we hear strongly</text>
    <text x="15" y="62" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">influences our judgment.</text>

    <rect x="15" y="75" width="145" height="30" rx="6" fill="#f0fdf4"/>
    <text x="87" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#166534">💡 Counter: Consider multiple</text>
    <text x="87" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#166534">reference points</text>
  </g>

  <!-- Key insight -->
  <g filter="url(#biasShadow)" transform="translate(30, 315)">
    <rect width="740" height="85" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <text x="370" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Why This Matters</text>

    <rect x="20" y="35" width="700" height="40" rx="8" fill="#f8fafc"/>
    <text x="370" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">These biases aren't flaws — they're efficient mental shortcuts. But disinformation exploits them.</text>
    <text x="370" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1e293b">Awareness is the first step to defending against manipulation.</text>
  </g>
</svg>
