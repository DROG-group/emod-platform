<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550">
  <defs>
    <linearGradient id="russiaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#b91c1c"/>
    </linearGradient>
    <linearGradient id="platformGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Case Study: Internet Research Agency (2014-2018)</text>
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">How a documented FIMI operation was structured</text>

  <!-- Origin: St. Petersburg -->
  <g filter="url(#glow)" transform="translate(30, 75)">
    <rect width="180" height="150" rx="12" fill="white" stroke="#fecaca" stroke-width="2"/>
    <rect width="180" height="35" rx="12" fill="url(#russiaGrad)"/>
    <rect width="180" height="20" y="15" fill="url(#russiaGrad)"/>
    <text x="90" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">ORIGIN</text>

    <!-- Building icon -->
    <rect x="70" y="50" width="40" height="30" fill="#fee2e2" rx="2"/>
    <rect x="75" y="55" width="8" height="8" fill="#fca5a5"/>
    <rect x="87" y="55" width="8" height="8" fill="#fca5a5"/>
    <rect x="99" y="55" width="8" height="8" fill="#fca5a5"/>
    <rect x="75" y="67" width="8" height="8" fill="#fca5a5"/>
    <rect x="87" y="67" width="8" height="8" fill="#fca5a5"/>
    <rect x="99" y="67" width="8" height="8" fill="#fca5a5"/>

    <text x="90" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#991b1b">St. Petersburg</text>
    <text x="90" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7f1d1d">Single building</text>
    <text x="90" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7f1d1d">Shift-based work</text>
    <text x="90" y="141" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7f1d1d">Quotas &amp; calendars</text>

    <!-- Budget indicator -->
    <rect x="50" y="155" width="80" height="18" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="90" y="167" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">$1M+ /month</text>
  </g>

  <!-- Arrow from Origin to Production -->
  <line x1="215" y1="150" x2="255" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#flowArrow)"/>

  <!-- Production: Fake Personas -->
  <g filter="url(#glow)" transform="translate(260, 75)">
    <rect width="180" height="150" rx="12" fill="white" stroke="#fde68a" stroke-width="2"/>
    <rect width="180" height="35" rx="12" fill="#f59e0b"/>
    <rect width="180" height="20" y="15" fill="#f59e0b"/>
    <text x="90" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">PRODUCTION</text>

    <!-- Persona icons -->
    <g transform="translate(35, 50)">
      <circle cx="15" cy="12" r="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
      <circle cx="15" cy="8" r="4" fill="#fbbf24"/>
      <path d="M8,18 Q15,22 22,18" fill="none" stroke="#fbbf24" stroke-width="2"/>
    </g>
    <g transform="translate(75, 50)">
      <circle cx="15" cy="12" r="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
      <circle cx="15" cy="8" r="4" fill="#fbbf24"/>
      <path d="M8,18 Q15,22 22,18" fill="none" stroke="#fbbf24" stroke-width="2"/>
    </g>
    <g transform="translate(115, 50)">
      <circle cx="15" cy="12" r="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
      <circle cx="15" cy="8" r="4" fill="#fbbf24"/>
      <path d="M8,18 Q15,22 22,18" fill="none" stroke="#fbbf24" stroke-width="2"/>
    </g>

    <text x="90" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#92400e">Fake Personas</text>
    <text x="90" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#b45309">Posed as Americans</text>
    <text x="90" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#b45309">Fabricated movements</text>
    <text x="90" y="141" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#b45309">Stock/AI photos</text>

    <!-- Account count -->
    <rect x="50" y="155" width="80" height="18" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="90" y="167" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#d97706">Hundreds of accounts</text>
  </g>

  <!-- Arrow from Production to Distribution -->
  <line x1="445" y1="150" x2="485" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#flowArrow)"/>

  <!-- Distribution: Platforms -->
  <g filter="url(#glow)" transform="translate(490, 75)">
    <rect width="180" height="150" rx="12" fill="white" stroke="#bfdbfe" stroke-width="2"/>
    <rect width="180" height="35" rx="12" fill="url(#platformGrad)"/>
    <rect width="180" height="20" y="15" fill="url(#platformGrad)"/>
    <text x="90" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">DISTRIBUTION</text>

    <!-- Platform icons -->
    <g transform="translate(25, 55)">
      <rect width="35" height="25" rx="4" fill="#dbeafe"/>
      <text x="17" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#2563eb">FB</text>
    </g>
    <g transform="translate(72, 55)">
      <rect width="35" height="25" rx="4" fill="#dbeafe"/>
      <text x="17" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#2563eb">TW</text>
    </g>
    <g transform="translate(119, 55)">
      <rect width="35" height="25" rx="4" fill="#dbeafe"/>
      <text x="17" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#2563eb">IG</text>
    </g>

    <text x="90" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1e40af">Cross-Platform</text>
    <text x="90" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#2563eb">Simultaneous posting</text>
    <text x="90" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#2563eb">Coordinated amplification</text>
    <text x="90" y="141" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#2563eb">Paid advertising</text>

    <!-- Reach count -->
    <rect x="50" y="155" width="80" height="18" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="90" y="167" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">126M Americans</text>
  </g>

  <!-- Arrow down to Targets -->
  <line x1="580" y1="230" x2="580" y2="265" stroke="#94a3b8" stroke-width="2" marker-end="url(#flowArrow)"/>

  <!-- Targets Section -->
  <g filter="url(#glow)" transform="translate(260, 280)">
    <rect width="410" height="120" rx="12" fill="white" stroke="#c4b5fd" stroke-width="2"/>
    <rect width="410" height="35" rx="12" fill="url(#targetGrad)"/>
    <rect width="410" height="20" y="15" fill="url(#targetGrad)"/>
    <text x="205" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">TARGETS: Divisive Issues</text>

    <!-- Target topics -->
    <g transform="translate(20, 50)">
      <rect width="85" height="55" rx="6" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
      <text x="42" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#7c3aed">Race</text>
      <text x="42" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9333ea">Both sides</text>
      <text x="42" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9333ea">amplified</text>
    </g>
    <g transform="translate(115, 50)">
      <rect width="85" height="55" rx="6" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
      <text x="42" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#7c3aed">Immigration</text>
      <text x="42" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9333ea">Pro &amp; anti</text>
      <text x="42" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9333ea">content</text>
    </g>
    <g transform="translate(210, 50)">
      <rect width="85" height="55" rx="6" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
      <text x="42" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#7c3aed">Gun Rights</text>
      <text x="42" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9333ea">Inflame</text>
      <text x="42" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9333ea">debate</text>
    </g>
    <g transform="translate(305, 50)">
      <rect width="85" height="55" rx="6" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
      <text x="42" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#7c3aed">Elections</text>
      <text x="42" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9333ea">Candidate</text>
      <text x="42" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9333ea">attacks</text>
    </g>
  </g>

  <!-- Detection Signals Box -->
  <g filter="url(#glow)" transform="translate(30, 420)">
    <rect width="360" height="110" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="180" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#166534">How It Was Detected</text>

    <g transform="translate(15, 40)">
      <circle cx="8" cy="8" r="4" fill="#22c55e"/>
      <text x="20" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Scale: Hundreds of coordinated accounts</text>
    </g>
    <g transform="translate(15, 58)">
      <circle cx="8" cy="8" r="4" fill="#22c55e"/>
      <text x="20" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Fake personas: Reverse image search exposed</text>
    </g>
    <g transform="translate(15, 76)">
      <circle cx="8" cy="8" r="4" fill="#22c55e"/>
      <text x="20" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Cross-platform: Same content, similar timing</text>
    </g>
    <g transform="translate(15, 94)">
      <circle cx="8" cy="8" r="4" fill="#22c55e"/>
      <text x="20" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Never-criticize-Russia pattern visible</text>
    </g>
  </g>

  <!-- Attribution Box -->
  <g filter="url(#glow)" transform="translate(410, 420)">
    <rect width="360" height="110" rx="12" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
    <text x="180" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#a16207">Attribution Evidence</text>

    <g transform="translate(15, 40)">
      <circle cx="8" cy="8" r="4" fill="#eab308"/>
      <text x="20" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#a16207">Physical location confirmed in Russia</text>
    </g>
    <g transform="translate(15, 58)">
      <circle cx="8" cy="8" r="4" fill="#eab308"/>
      <text x="20" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#a16207">Funding traced to govt-connected entities</text>
    </g>
    <g transform="translate(15, 76)">
      <circle cx="8" cy="8" r="4" fill="#eab308"/>
      <text x="20" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#a16207">Content aligned with state interests</text>
    </g>
    <g transform="translate(15, 94)">
      <circle cx="8" cy="8" r="4" fill="#eab308"/>
      <text x="20" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#a16207">Full attribution required investigation access</text>
    </g>
  </g>
</svg>