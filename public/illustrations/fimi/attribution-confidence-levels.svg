<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="highConf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
    <linearGradient id="medConf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="lowConf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <filter id="confShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Attribution Confidence Levels</text>
  <text x="400" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Match your language to your evidence - never overclaim</text>

  <!-- Confidence Scale -->
  <g transform="translate(50, 80)">
    <rect width="700" height="20" rx="10" fill="#e2e8f0"/>
    <rect width="233" height="20" rx="10" fill="url(#lowConf)" x="0"/>
    <rect width="234" height="20" rx="0" fill="url(#medConf)" x="233"/>
    <rect width="233" height="20" rx="10" fill="url(#highConf)" x="467"/>
    <rect width="234" height="20" fill="url(#medConf)" x="233"/>

    <text x="116" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white">LOW</text>
    <text x="350" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white">MEDIUM</text>
    <text x="583" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white">HIGH</text>
  </g>

  <!-- Low Confidence -->
  <g filter="url(#confShadow)" transform="translate(30, 120)">
    <rect width="240" height="320" rx="16" fill="white" stroke="#fecaca" stroke-width="2"/>
    <rect width="240" height="45" rx="16" fill="#fee2e2"/>
    <rect width="240" height="25" y="20" fill="#fee2e2"/>

    <text x="120" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Low Confidence</text>

    <!-- Evidence -->
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">Evidence Available</text>
    <g transform="translate(20, 82)">
      <circle cx="6" cy="6" r="3" fill="#fca5a5"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b">Suspicious patterns only</text>
    </g>
    <g transform="translate(20, 100)">
      <circle cx="6" cy="6" r="3" fill="#fca5a5"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b">Circumstantial indicators</text>
    </g>
    <g transform="translate(20, 118)">
      <circle cx="6" cy="6" r="3" fill="#fca5a5"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b">Could explain organically</text>
    </g>

    <!-- Language -->
    <text x="20" y="155" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">Use This Language</text>
    <rect x="15" y="165" width="210" height="65" rx="6" fill="#fef2f2"/>
    <text x="120" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b">"may indicate"</text>
    <text x="120" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b">"possibly connected to"</text>
    <text x="120" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b">"patterns consistent with"</text>
    <text x="120" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b">"warrants further investigation"</text>

    <!-- Actions -->
    <text x="20" y="255" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">Appropriate Actions</text>
    <g transform="translate(20, 267)">
      <rect width="200" height="20" rx="4" fill="#fecaca"/>
      <text x="100" y="14" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b">Continue monitoring</text>
    </g>
    <g transform="translate(20, 292)">
      <rect width="200" height="20" rx="4" fill="#fecaca"/>
      <text x="100" y="14" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b">Seek additional evidence</text>
    </g>
  </g>

  <!-- Medium Confidence -->
  <g filter="url(#confShadow)" transform="translate(280, 120)">
    <rect width="240" height="320" rx="16" fill="white" stroke="#fde68a" stroke-width="2"/>
    <rect width="240" height="45" rx="16" fill="#fef3c7"/>
    <rect width="240" height="25" y="20" fill="#fef3c7"/>

    <text x="120" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">Medium Confidence</text>

    <!-- Evidence -->
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Evidence Available</text>
    <g transform="translate(20, 82)">
      <circle cx="6" cy="6" r="3" fill="#fcd34d"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">Multiple technical indicators</text>
    </g>
    <g transform="translate(20, 100)">
      <circle cx="6" cy="6" r="3" fill="#fcd34d"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">Pattern matches known ops</text>
    </g>
    <g transform="translate(20, 118)">
      <circle cx="6" cy="6" r="3" fill="#fcd34d"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">Alternative explanations exist</text>
    </g>

    <!-- Language -->
    <text x="20" y="155" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Use This Language</text>
    <rect x="15" y="165" width="210" height="65" rx="6" fill="#fffbeb"/>
    <text x="120" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">"likely connected to"</text>
    <text x="120" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">"assess with moderate confidence"</text>
    <text x="120" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">"probable attribution to"</text>
    <text x="120" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">"evidence suggests"</text>

    <!-- Actions -->
    <text x="20" y="255" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Appropriate Actions</text>
    <g transform="translate(20, 267)">
      <rect width="200" height="20" rx="4" fill="#fde68a"/>
      <text x="100" y="14" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#92400e">Brief stakeholders with caveats</text>
    </g>
    <g transform="translate(20, 292)">
      <rect width="200" height="20" rx="4" fill="#fde68a"/>
      <text x="100" y="14" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#92400e">Platform escalation possible</text>
    </g>
  </g>

  <!-- High Confidence -->
  <g filter="url(#confShadow)" transform="translate(530, 120)">
    <rect width="240" height="320" rx="16" fill="white" stroke="#86efac" stroke-width="2"/>
    <rect width="240" height="45" rx="16" fill="#dcfce7"/>
    <rect width="240" height="25" y="20" fill="#dcfce7"/>

    <text x="120" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#166534">High Confidence</text>

    <!-- Evidence -->
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#166534">Evidence Available</text>
    <g transform="translate(20, 82)">
      <circle cx="6" cy="6" r="3" fill="#4ade80"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#166534">Confirmed technical evidence</text>
    </g>
    <g transform="translate(20, 100)">
      <circle cx="6" cy="6" r="3" fill="#4ade80"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#166534">Corroborating sources</text>
    </g>
    <g transform="translate(20, 118)">
      <circle cx="6" cy="6" r="3" fill="#4ade80"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#166534">Alternative explanations ruled out</text>
    </g>

    <!-- Language -->
    <text x="20" y="155" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#166534">Use This Language</text>
    <rect x="15" y="165" width="210" height="65" rx="6" fill="#f0fdf4"/>
    <text x="120" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#166534">"assess with high confidence"</text>
    <text x="120" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#166534">"attribute to"</text>
    <text x="120" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#166534">"evidence confirms"</text>
    <text x="120" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#166534">"operation conducted by"</text>

    <!-- Actions -->
    <text x="20" y="255" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#166534">Appropriate Actions</text>
    <g transform="translate(20, 267)">
      <rect width="200" height="20" rx="4" fill="#86efac"/>
      <text x="100" y="14" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">Public attribution possible</text>
    </g>
    <g transform="translate(20, 292)">
      <rect width="200" height="20" rx="4" fill="#86efac"/>
      <text x="100" y="14" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">Diplomatic/legal options available</text>
    </g>
  </g>

  <!-- Warning -->
  <g transform="translate(50, 455)">
    <rect width="700" height="22" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="350" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626">Warning: Overclaiming attribution damages credibility and wastes diplomatic capital</text>
  </g>
</svg>