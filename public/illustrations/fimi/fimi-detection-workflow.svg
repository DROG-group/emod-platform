<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="step1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="step2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="step3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="step4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">FIMI Detection Workflow</text>
  <text x="400" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Start with harm, not origin</text>

  <!-- Step 1: Assess Harm -->
  <g filter="url(#shadow)" transform="translate(50, 80)">
    <rect width="320" height="100" rx="12" fill="white" stroke="#fee2e2" stroke-width="2"/>
    <rect width="320" height="8" rx="4" fill="url(#step1Grad)" y="0"/>
    <circle cx="30" cy="50" r="20" fill="url(#step1Grad)"/>
    <text x="30" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">1</text>
    <text x="65" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Assess Harm &amp; Intent</text>
    <text x="65" y="58" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">What harm is occurring?</text>
    <text x="65" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Democratic processes • Public safety</text>
    <text x="65" y="88" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Institutional trust • Vulnerable groups</text>
  </g>

  <!-- Stop indicator 1 -->
  <g transform="translate(380, 110)">
    <rect x="0" y="0" width="90" height="40" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="45" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#dc2626">No clear harm?</text>
    <text x="45" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ef4444">STOP</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="210" y1="185" x2="210" y2="200" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- Step 2: Coordination -->
  <g filter="url(#shadow)" transform="translate(50, 210)">
    <rect width="320" height="100" rx="12" fill="white" stroke="#fef3c7" stroke-width="2"/>
    <rect width="320" height="8" rx="4" fill="url(#step2Grad)" y="0"/>
    <circle cx="30" cy="50" r="20" fill="url(#step2Grad)"/>
    <text x="30" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">2</text>
    <text x="65" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Check Coordination Patterns</text>
    <text x="65" y="58" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Is this organized activity?</text>
    <text x="65" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Synchronized timing • Template messaging</text>
    <text x="65" y="88" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Cross-platform spread • Network isolation</text>
  </g>

  <!-- Note for Step 2 -->
  <g transform="translate(380, 240)">
    <rect x="0" y="0" width="90" height="40" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="45" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#b45309">Note: Activists</text>
    <text x="45" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#d97706">also coordinate</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="210" y1="315" x2="210" y2="330" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- Step 3: Deception -->
  <g filter="url(#shadow)" transform="translate(430, 80)">
    <rect width="320" height="100" rx="12" fill="white" stroke="#dbeafe" stroke-width="2"/>
    <rect width="320" height="8" rx="4" fill="url(#step3Grad)" y="0"/>
    <circle cx="30" cy="50" r="20" fill="url(#step3Grad)"/>
    <text x="30" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">3</text>
    <text x="65" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Look for Deception</text>
    <text x="65" y="58" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Are identities or origins fake?</text>
    <text x="65" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Fake personas • Stolen identities</text>
    <text x="65" y="88" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Misleading attribution • Aged accounts</text>
  </g>

  <!-- Step 4: Foreign Attribution -->
  <g filter="url(#shadow)" transform="translate(430, 210)">
    <rect width="320" height="100" rx="12" fill="white" stroke="#ede9fe" stroke-width="2"/>
    <rect width="320" height="8" rx="4" fill="url(#step4Grad)" y="0"/>
    <circle cx="30" cy="50" r="20" fill="url(#step4Grad)"/>
    <text x="30" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">4</text>
    <text x="65" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Assess Foreign Attribution</text>
    <text x="65" y="58" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Only after steps 1-3 confirmed</text>
    <text x="65" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Language artifacts • Timezone patterns</text>
    <text x="65" y="88" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Infrastructure links • Interest alignment</text>
  </g>

  <!-- Connecting arrows between right side steps -->
  <path d="M 590 185 L 590 200" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- Key Insight Box -->
  <g filter="url(#shadow)" transform="translate(50, 340)">
    <rect width="700" height="70" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="30" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">Key Insight</text>
    <text x="30" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#15803d">Foreign origin matters for response strategy, but harm + coordination + deception matter more than passport.</text>
  </g>

  <!-- Output Box -->
  <g filter="url(#shadow)" transform="translate(50, 425)">
    <rect width="700" height="55" rx="10" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <text x="30" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#475569">OUTPUT FORMAT:</text>
    <text x="30" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Assessment → Confidence (Low/Med/High) → Next Action</text>
    <rect x="430" y="15" width="80" height="25" rx="4" fill="#dcfce7"/>
    <text x="470" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#166534">Escalate</text>
    <rect x="520" y="15" width="80" height="25" rx="4" fill="#fef3c7"/>
    <text x="560" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#b45309">Monitor</text>
    <rect x="610" y="15" width="80" height="25" rx="4" fill="#fee2e2"/>
    <text x="650" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#dc2626">Close</text>
  </g>
</svg>