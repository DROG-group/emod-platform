<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="strongGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <linearGradient id="mediumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="weakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6b7280"/>
      <stop offset="100%" style="stop-color:#9ca3af"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Coordination Signal Strength</text>
  <text x="400" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">What indicates coordinated manipulation vs organic activity</text>

  <!-- Strong Signals Section -->
  <g filter="url(#cardShadow)" transform="translate(30, 75)">
    <rect width="740" height="130" rx="12" fill="white"/>
    <rect width="740" height="10" rx="5" fill="url(#strongGrad)" y="0"/>

    <!-- Header -->
    <circle cx="35" cy="40" r="18" fill="#fee2e2"/>
    <text x="35" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#dc2626">!</text>
    <text x="65" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">STRONG SIGNALS</text>
    <text x="65" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#7f1d1d">High confidence of coordinated manipulation</text>

    <!-- Signal items -->
    <g transform="translate(30, 70)">
      <!-- Item 1 -->
      <g>
        <rect width="160" height="50" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
        <text x="80" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#991b1b">Synchronized Timing</text>
        <text x="80" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#b91c1c">Posts within minutes</text>
        <text x="80" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#b91c1c">across many accounts</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(175, 0)">
        <rect width="160" height="50" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
        <text x="80" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#991b1b">Template Messages</text>
        <text x="80" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#b91c1c">Identical phrasing with</text>
        <text x="80" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#b91c1c">variable substitution</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(350, 0)">
        <rect width="160" height="50" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
        <text x="80" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#991b1b">Cross-Platform</text>
        <text x="80" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#b91c1c">Same content on</text>
        <text x="80" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#b91c1c">multiple platforms</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(525, 0)">
        <rect width="160" height="50" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
        <text x="80" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#991b1b">Network Isolation</text>
        <text x="80" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#b91c1c">Accounts only interact</text>
        <text x="80" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#b91c1c">with each other</text>
      </g>
    </g>
  </g>

  <!-- Medium Signals Section -->
  <g filter="url(#cardShadow)" transform="translate(30, 220)">
    <rect width="740" height="130" rx="12" fill="white"/>
    <rect width="740" height="10" rx="5" fill="url(#mediumGrad)" y="0"/>

    <!-- Header -->
    <circle cx="35" cy="40" r="18" fill="#fef3c7"/>
    <text x="35" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#d97706">?</text>
    <text x="65" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#d97706">MEDIUM SIGNALS</text>
    <text x="65" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#92400e">Investigate further - could be coordination OR legitimate</text>

    <!-- Signal items -->
    <g transform="translate(30, 70)">
      <!-- Item 1 -->
      <g>
        <rect width="160" height="50" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
        <text x="80" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#92400e">Similar Messaging</text>
        <text x="80" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">Activists also use</text>
        <text x="80" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">talking points</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(175, 0)">
        <rect width="160" height="50" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
        <text x="80" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#92400e">Some Suspicious</text>
        <text x="80" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">A few accounts show</text>
        <text x="80" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">unusual patterns</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(350, 0)">
        <rect width="160" height="50" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
        <text x="80" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#92400e">High Engagement</text>
        <text x="80" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">Viral spread but</text>
        <text x="80" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">unclear origin</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(525, 0)">
        <rect width="160" height="50" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
        <text x="80" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#92400e">Mixed True/False</text>
        <text x="80" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">Content combines</text>
        <text x="80" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">facts with falsehoods</text>
      </g>
    </g>
  </g>

  <!-- Weak Signals Section -->
  <g filter="url(#cardShadow)" transform="translate(30, 365)">
    <rect width="740" height="130" rx="12" fill="white"/>
    <rect width="740" height="10" rx="5" fill="url(#weakGrad)" y="0"/>

    <!-- Header -->
    <circle cx="35" cy="40" r="18" fill="#f3f4f6"/>
    <text x="35" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">~</text>
    <text x="65" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#6b7280">WEAK SIGNALS</text>
    <text x="65" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#4b5563">Insufficient alone - do not use as primary evidence</text>

    <!-- Signal items -->
    <g transform="translate(30, 70)">
      <!-- Item 1 -->
      <g>
        <rect width="160" height="50" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
        <text x="80" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#4b5563">"Feels Manipulative"</text>
        <text x="80" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6b7280">Vibes aren't</text>
        <text x="80" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6b7280">evidence</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(175, 0)">
        <rect width="160" height="50" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
        <text x="80" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#4b5563">Same Hashtags</text>
        <text x="80" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6b7280">Normal for trending</text>
        <text x="80" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6b7280">topics</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(350, 0)">
        <rect width="160" height="50" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
        <text x="80" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#4b5563">New Accounts</text>
        <text x="80" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6b7280">People create accounts</text>
        <text x="80" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6b7280">for activism too</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(525, 0)">
        <rect width="160" height="50" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
        <text x="80" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#4b5563">"Who Benefits?"</text>
        <text x="80" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6b7280">Speculation without</text>
        <text x="80" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6b7280">evidence</text>
      </g>
    </g>
  </g>
</svg>