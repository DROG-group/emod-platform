<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580">
  <defs>
    <linearGradient id="stateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#b91c1c"/>
    </linearGradient>
    <linearGradient id="commercialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ideologicalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
    <filter id="actorShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="580" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">FIMI Actor Types</text>
  <text x="400" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Understanding who conducts information operations</text>

  <!-- State Actors Column -->
  <g filter="url(#actorShadow)" transform="translate(25, 75)">
    <rect width="240" height="480" rx="16" fill="white"/>
    <rect width="240" height="50" rx="16" fill="url(#stateGrad)"/>
    <rect width="240" height="30" y="20" fill="url(#stateGrad)"/>

    <!-- Icon -->
    <g transform="translate(95, 12)">
      <rect x="0" y="8" width="50" height="30" rx="2" fill="white" opacity="0.2"/>
      <rect x="5" y="0" width="40" height="8" fill="white" opacity="0.3"/>
      <rect x="20" y="12" width="10" height="22" fill="white" opacity="0.2"/>
    </g>

    <text x="120" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">State Actors</text>

    <!-- Characteristics -->
    <text x="20" y="100" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Characteristics</text>

    <g transform="translate(20, 115)">
      <rect width="200" height="30" rx="6" fill="#fef2f2"/>
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#7f1d1d">Sustained operations (months/years)</text>
    </g>
    <g transform="translate(20, 150)">
      <rect width="200" height="30" rx="6" fill="#fef2f2"/>
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#7f1d1d">No need for commercial ROI</text>
    </g>
    <g transform="translate(20, 185)">
      <rect width="200" height="30" rx="6" fill="#fef2f2"/>
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#7f1d1d">Sophisticated security practices</text>
    </g>
    <g transform="translate(20, 220)">
      <rect width="200" height="30" rx="6" fill="#fef2f2"/>
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#7f1d1d">Intelligence-informed targeting</text>
    </g>

    <!-- Examples -->
    <text x="20" y="275" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Examples</text>
    <text x="20" y="295" font-family="system-ui, sans-serif" font-size="9" fill="#7f1d1d">• SVR/GRU (Russia)</text>
    <text x="20" y="310" font-family="system-ui, sans-serif" font-size="9" fill="#7f1d1d">• MSS (China)</text>
    <text x="20" y="325" font-family="system-ui, sans-serif" font-size="9" fill="#7f1d1d">• IRGC (Iran)</text>
    <text x="20" y="340" font-family="system-ui, sans-serif" font-size="9" fill="#7f1d1d">• State media services</text>

    <!-- Detection Signals -->
    <text x="20" y="375" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Detection Signals</text>
    <g transform="translate(20, 390)">
      <circle cx="6" cy="6" r="4" fill="#dc2626"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="8" fill="#7f1d1d">Long-duration campaigns</text>
    </g>
    <g transform="translate(20, 408)">
      <circle cx="6" cy="6" r="4" fill="#dc2626"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="8" fill="#7f1d1d">Aligned with foreign policy</text>
    </g>
    <g transform="translate(20, 426)">
      <circle cx="6" cy="6" r="4" fill="#dc2626"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="8" fill="#7f1d1d">Rebuilds after exposure</text>
    </g>
    <g transform="translate(20, 444)">
      <circle cx="6" cy="6" r="4" fill="#dc2626"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="8" fill="#7f1d1d">Never criticizes sponsor state</text>
    </g>

    <!-- Response -->
    <rect x="20" y="470" width="200" height="30" rx="6" fill="#fecaca"/>
    <text x="120" y="490" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#991b1b">Response: Diplomatic + Security</text>
  </g>

  <!-- Commercial Actors Column -->
  <g filter="url(#actorShadow)" transform="translate(280, 75)">
    <rect width="240" height="480" rx="16" fill="white"/>
    <rect width="240" height="50" rx="16" fill="url(#commercialGrad)"/>
    <rect width="240" height="30" y="20" fill="url(#commercialGrad)"/>

    <!-- Icon -->
    <g transform="translate(100, 15)">
      <circle cx="20" cy="15" r="15" fill="white" opacity="0.2"/>
      <text x="20" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="white">$</text>
    </g>

    <text x="120" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">Commercial Actors</text>

    <!-- Characteristics -->
    <text x="20" y="100" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Characteristics</text>

    <g transform="translate(20, 115)">
      <rect width="200" height="30" rx="6" fill="#eff6ff"/>
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#1e3a8a">Activity scales with payment</text>
    </g>
    <g transform="translate(20, 150)">
      <rect width="200" height="30" rx="6" fill="#eff6ff"/>
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#1e3a8a">Multiple clients, various causes</text>
    </g>
    <g transform="translate(20, 185)">
      <rect width="200" height="30" rx="6" fill="#eff6ff"/>
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#1e3a8a">Focus on deliverable metrics</text>
    </g>
    <g transform="translate(20, 220)">
      <rect width="200" height="30" rx="6" fill="#eff6ff"/>
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#1e3a8a">Reuse tactics across clients</text>
    </g>

    <!-- Examples -->
    <text x="20" y="275" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Examples</text>
    <text x="20" y="295" font-family="system-ui, sans-serif" font-size="9" fill="#1e3a8a">• PR/marketing firms</text>
    <text x="20" y="310" font-family="system-ui, sans-serif" font-size="9" fill="#1e3a8a">• "Black PR" specialists</text>
    <text x="20" y="325" font-family="system-ui, sans-serif" font-size="9" fill="#1e3a8a">• Troll farms for hire</text>
    <text x="20" y="340" font-family="system-ui, sans-serif" font-size="9" fill="#1e3a8a">• SEO manipulation firms</text>

    <!-- Detection Signals -->
    <text x="20" y="375" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Detection Signals</text>
    <g transform="translate(20, 390)">
      <circle cx="6" cy="6" r="4" fill="#2563eb"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="8" fill="#1e3a8a">Campaign-based structure</text>
    </g>
    <g transform="translate(20, 408)">
      <circle cx="6" cy="6" r="4" fill="#2563eb"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="8" fill="#1e3a8a">Payment timing correlates</text>
    </g>
    <g transform="translate(20, 426)">
      <circle cx="6" cy="6" r="4" fill="#2563eb"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="8" fill="#1e3a8a">Stops when exposed</text>
    </g>
    <g transform="translate(20, 444)">
      <circle cx="6" cy="6" r="4" fill="#2563eb"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="8" fill="#1e3a8a">Traceable business records</text>
    </g>

    <!-- Response -->
    <rect x="20" y="470" width="200" height="30" rx="6" fill="#bfdbfe"/>
    <text x="120" y="490" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1e40af">Response: Legal + Regulatory</text>
  </g>

  <!-- Ideological Actors Column -->
  <g filter="url(#actorShadow)" transform="translate(535, 75)">
    <rect width="240" height="480" rx="16" fill="white"/>
    <rect width="240" height="50" rx="16" fill="url(#ideologicalGrad)"/>
    <rect width="240" height="30" y="20" fill="url(#ideologicalGrad)"/>

    <!-- Icon -->
    <g transform="translate(100, 12)">
      <circle cx="20" cy="18" r="12" fill="white" opacity="0.2"/>
      <path d="M15,25 L20,10 L25,25" fill="none" stroke="white" stroke-width="2" opacity="0.8"/>
    </g>

    <text x="120" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">Ideological Actors</text>

    <!-- Characteristics -->
    <text x="20" y="100" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#166534">Characteristics</text>

    <g transform="translate(20, 115)">
      <rect width="200" height="30" rx="6" fill="#f0fdf4"/>
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#14532d">Genuine belief in cause</text>
    </g>
    <g transform="translate(20, 150)">
      <rect width="200" height="30" rx="6" fill="#f0fdf4"/>
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#14532d">Volunteer-driven, variable effort</text>
    </g>
    <g transform="translate(20, 185)">
      <rect width="200" height="30" rx="6" fill="#f0fdf4"/>
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#14532d">May align with foreign interests</text>
    </g>
    <g transform="translate(20, 220)">
      <rect width="200" height="30" rx="6" fill="#f0fdf4"/>
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#14532d">Community accountability</text>
    </g>

    <!-- Examples -->
    <text x="20" y="275" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#166534">Examples</text>
    <text x="20" y="295" font-family="system-ui, sans-serif" font-size="9" fill="#14532d">• Political movements</text>
    <text x="20" y="310" font-family="system-ui, sans-serif" font-size="9" fill="#14532d">• Conspiracy communities</text>
    <text x="20" y="325" font-family="system-ui, sans-serif" font-size="9" fill="#14532d">• Activist networks</text>
    <text x="20" y="340" font-family="system-ui, sans-serif" font-size="9" fill="#14532d">• Partisan media</text>

    <!-- Detection Signals -->
    <text x="20" y="375" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#166534">Detection Signals</text>
    <g transform="translate(20, 390)">
      <circle cx="6" cy="6" r="4" fill="#16a34a"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="8" fill="#14532d">Real identities often visible</text>
    </g>
    <g transform="translate(20, 408)">
      <circle cx="6" cy="6" r="4" fill="#16a34a"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="8" fill="#14532d">Community engagement</text>
    </g>
    <g transform="translate(20, 426)">
      <circle cx="6" cy="6" r="4" fill="#16a34a"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="8" fill="#14532d">Emotional investment</text>
    </g>
    <g transform="translate(20, 444)">
      <circle cx="6" cy="6" r="4" fill="#16a34a"/>
      <text x="16" y="10" font-family="system-ui, sans-serif" font-size="8" fill="#14532d">Defends when challenged</text>
    </g>

    <!-- Response -->
    <rect x="20" y="470" width="200" height="30" rx="6" fill="#bbf7d0"/>
    <text x="120" y="490" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#166534">Response: Counter-speech</text>
  </g>
</svg>