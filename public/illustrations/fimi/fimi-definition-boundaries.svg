<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="fimiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#fafafa"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">What FIMI Is (And Isn't)</text>

  <!-- FIMI Circle (Center) -->
  <circle cx="400" cy="240" r="130" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3" filter="url(#softShadow)"/>
  <text x="400" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#5b21b6">FIMI</text>
  <text x="400" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7c3aed">Pattern of behaviour</text>
  <text x="400" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7c3aed">Manipulative + Coordinated</text>
  <text x="400" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7c3aed">Intentional harm</text>

  <!-- Five Key Elements inside FIMI -->
  <g transform="translate(330, 290)">
    <rect width="140" height="60" rx="8" fill="white" stroke="#c4b5fd" stroke-width="1"/>
    <text x="70" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#6d28d9">5 Key Elements</text>
    <text x="70" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">1. Pattern of behaviour</text>
    <text x="70" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">2. Threatens values/processes</text>
    <text x="70" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">3. Manipulative (deceptive)</text>
  </g>

  <!-- NOT FIMI boxes around the circle -->

  <!-- Box 1: Foreign News (Top Left) -->
  <g filter="url(#softShadow)" transform="translate(40, 70)">
    <rect width="160" height="80" rx="10" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="160" height="6" rx="3" fill="#94a3b8" y="0"/>
    <text x="80" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#475569">Foreign News</text>
    <text x="80" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Critical coverage from</text>
    <text x="80" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">foreign media outlets</text>
    <text x="80" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#10b981">Not FIMI</text>
  </g>

  <!-- Dashed line to center -->
  <line x1="200" y1="130" x2="300" y2="180" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Box 2: Diaspora Activity (Top Right) -->
  <g filter="url(#softShadow)" transform="translate(600, 70)">
    <rect width="160" height="80" rx="10" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="160" height="6" rx="3" fill="#94a3b8" y="0"/>
    <text x="80" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#475569">Diaspora Activity</text>
    <text x="80" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Political engagement by</text>
    <text x="80" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">immigrant communities</text>
    <text x="80" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#10b981">Not FIMI</text>
  </g>

  <line x1="600" y1="130" x2="500" y2="180" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Box 3: Domestic Disinfo (Left) -->
  <g filter="url(#softShadow)" transform="translate(40, 200)">
    <rect width="160" height="80" rx="10" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="160" height="6" rx="3" fill="#f59e0b" y="0"/>
    <text x="80" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#475569">Domestic Disinfo</text>
    <text x="80" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Harmful but different</text>
    <text x="80" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">response required</text>
    <text x="80" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#f59e0b">Not FIMI (but harmful)</text>
  </g>

  <line x1="200" y1="240" x2="270" y2="240" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Box 4: Commercial Misinfo (Right) -->
  <g filter="url(#softShadow)" transform="translate(600, 200)">
    <rect width="160" height="80" rx="10" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="160" height="6" rx="3" fill="#f59e0b" y="0"/>
    <text x="80" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#475569">Commercial Misinfo</text>
    <text x="80" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Advertising/scams</text>
    <text x="80" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">handled by regulation</text>
    <text x="80" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#f59e0b">Not FIMI (different tools)</text>
  </g>

  <line x1="600" y1="240" x2="530" y2="240" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Box 5: Political Campaigns (Bottom Left) -->
  <g filter="url(#softShadow)" transform="translate(40, 330)">
    <rect width="160" height="80" rx="10" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="160" height="6" rx="3" fill="#94a3b8" y="0"/>
    <text x="80" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#475569">Political Campaigns</text>
    <text x="80" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Legitimate coordination</text>
    <text x="80" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">for political goals</text>
    <text x="80" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#10b981">Not FIMI</text>
  </g>

  <line x1="200" y1="350" x2="310" y2="310" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Box 6: Activist Movements (Bottom Right) -->
  <g filter="url(#softShadow)" transform="translate(600, 330)">
    <rect width="160" height="80" rx="10" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="160" height="6" rx="3" fill="#94a3b8" y="0"/>
    <text x="80" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#475569">Activist Movements</text>
    <text x="80" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Social movements</text>
    <text x="80" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">with shared messaging</text>
    <text x="80" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#10b981">Not FIMI</text>
  </g>

  <line x1="600" y1="350" x2="490" y2="310" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Warning box at bottom -->
  <g transform="translate(250, 420)">
    <rect width="300" height="25" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="150" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626">Overcalling FIMI damages credibility for real cases</text>
  </g>
</svg>