<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">Detection-Verification Pipeline</text>

  <!-- Stage 1: Monitoring -->
  <g filter="url(#shadow3)">
    <rect x="20" y="50" width="130" height="90" rx="10" fill="#f3f4f6"/>
    <rect x="20" y="50" width="130" height="30" rx="10" fill="#6b7280"/>
    <rect x="20" y="70" width="130" height="10" fill="#6b7280"/>
    <text x="85" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">Monitoring</text>
    <text x="85" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#4b5563">Broad scan</text>
    <text x="85" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#4b5563">What's happening?</text>
    <text x="85" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9ca3af">→ Awareness</text>
  </g>
  <line x1="155" y1="95" x2="175" y2="95" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Detection -->
  <g filter="url(#shadow3)">
    <rect x="180" y="50" width="130" height="90" rx="10" fill="#dbeafe"/>
    <rect x="180" y="50" width="130" height="30" rx="10" fill="#3b82f6"/>
    <rect x="180" y="70" width="130" height="10" fill="#3b82f6"/>
    <text x="245" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">Detection</text>
    <text x="245" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#4b5563">Anomaly ID</text>
    <text x="245" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#4b5563">Worth investigating?</text>
    <text x="245" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9ca3af">→ Generate leads</text>
  </g>
  <line x1="315" y1="95" x2="335" y2="95" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Investigation -->
  <g filter="url(#shadow3)">
    <rect x="340" y="50" width="130" height="90" rx="10" fill="#fef3c7"/>
    <rect x="340" y="50" width="130" height="30" rx="10" fill="#f59e0b"/>
    <rect x="340" y="70" width="130" height="10" fill="#f59e0b"/>
    <text x="405" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">Investigation</text>
    <text x="405" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#4b5563">Evidence gathering</text>
    <text x="405" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#4b5563">What explains this?</text>
    <text x="405" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9ca3af">→ Understanding</text>
  </g>
  <line x1="475" y1="95" x2="495" y2="95" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: Verification -->
  <g filter="url(#shadow3)">
    <rect x="500" y="50" width="130" height="90" rx="10" fill="#d1fae5"/>
    <rect x="500" y="50" width="130" height="30" rx="10" fill="#10b981"/>
    <rect x="500" y="70" width="130" height="10" fill="#10b981"/>
    <text x="565" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">Verification</text>
    <text x="565" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#4b5563">Confirmation</text>
    <text x="565" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#4b5563">Can we confirm?</text>
    <text x="565" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9ca3af">→ Conclusion</text>
  </g>
  <line x1="635" y1="95" x2="655" y2="95" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 5: Attribution -->
  <g filter="url(#shadow3)">
    <rect x="660" y="50" width="120" height="90" rx="10" fill="#ede9fe"/>
    <rect x="660" y="50" width="120" height="30" rx="10" fill="url(#pipeGrad)"/>
    <rect x="660" y="70" width="120" height="10" fill="url(#pipeGrad)"/>
    <text x="720" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">Attribution</text>
    <text x="720" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#4b5563">If needed</text>
    <text x="720" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#4b5563">Who is responsible?</text>
    <text x="720" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9ca3af">→ Identify actors</text>
  </g>

  <!-- Funnel indicator -->
  <text x="400" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <tspan font-weight="600">Funnel principle:</tspan> Most activity is organic. Each stage filters further.
  </text>
  <text x="400" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9ca3af">Lots enters at Stage 1 → Very little exits at Stage 5 with high confidence</text>
</svg>
