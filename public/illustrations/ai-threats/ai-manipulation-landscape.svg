<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="aiShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">AI and Information Manipulation</text>
  <text x="400" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">How AI changes the manipulation landscape</text>

  <!-- Content Generation -->
  <g filter="url(#aiShadow)" transform="translate(30, 70)">
    <rect width="235" height="170" rx="12" fill="white" stroke="#c4b5fd" stroke-width="2"/>
    <rect width="235" height="35" rx="12" fill="#8b5cf6"/>
    <rect width="235" height="15" y="20" fill="#8b5cf6"/>
    <text x="117" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">Content Generation</text>

    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#5b21b6">AI Capabilities:</text>
    <text x="20" y="72" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">• Text: Articles, comments, posts at scale</text>
    <text x="20" y="85" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">• Images: Photorealistic fake images</text>
    <text x="20" y="98" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">• Audio: Voice cloning, fake calls</text>
    <text x="20" y="111" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">• Video: Deepfakes, lip-sync</text>

    <rect x="10" y="125" width="215" height="35" rx="6" fill="#fef2f2"/>
    <text x="117" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#991b1b">Impact: Volume ↑ Quality ↑ Cost ↓</text>
    <text x="117" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#b91c1c">More content, faster, cheaper</text>
  </g>

  <!-- Targeting & Personalization -->
  <g filter="url(#aiShadow)" transform="translate(282, 70)">
    <rect width="235" height="170" rx="12" fill="white" stroke="#93c5fd" stroke-width="2"/>
    <rect width="235" height="35" rx="12" fill="#3b82f6"/>
    <rect width="235" height="15" y="20" fill="#3b82f6"/>
    <text x="117" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">Targeting &amp; Personalization</text>

    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1e40af">AI Capabilities:</text>
    <text x="20" y="72" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Identify vulnerable audiences</text>
    <text x="20" y="85" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Personalize messages at scale</text>
    <text x="20" y="98" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Predict what content will spread</text>
    <text x="20" y="111" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• A/B test narratives automatically</text>

    <rect x="10" y="125" width="215" height="35" rx="6" fill="#fef2f2"/>
    <text x="117" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#991b1b">Impact: Precision ↑ Effectiveness ↑</text>
    <text x="117" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#b91c1c">Right message, right person, right time</text>
  </g>

  <!-- Automation & Amplification -->
  <g filter="url(#aiShadow)" transform="translate(534, 70)">
    <rect width="235" height="170" rx="12" fill="white" stroke="#86efac" stroke-width="2"/>
    <rect width="235" height="35" rx="12" fill="#10b981"/>
    <rect width="235" height="15" y="20" fill="#10b981"/>
    <text x="117" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">Automation &amp; Amplification</text>

    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#166534">AI Capabilities:</text>
    <text x="20" y="72" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Smarter bots (pass detection)</text>
    <text x="20" y="85" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Automated engagement</text>
    <text x="20" y="98" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Adaptive behavior (learn to evade)</text>
    <text x="20" y="111" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Real-time response to events</text>

    <rect x="10" y="125" width="215" height="35" rx="6" fill="#fef2f2"/>
    <text x="117" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#991b1b">Impact: Scale ↑ Detection difficulty ↑</text>
    <text x="117" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#b91c1c">Harder to distinguish from humans</text>
  </g>

  <!-- What Changes vs Stays Same -->
  <g filter="url(#aiShadow)" transform="translate(30, 260)">
    <rect width="360" height="165" rx="12" fill="white" stroke="#fde68a" stroke-width="2"/>
    <text x="180" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#92400e">What AI Changes</text>

    <g transform="translate(15, 35)">
      <circle cx="8" cy="8" r="5" fill="#f59e0b"/>
      <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#b45309">Production speed and volume</text>
    </g>
    <g transform="translate(15, 55)">
      <circle cx="8" cy="8" r="5" fill="#f59e0b"/>
      <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#b45309">Quality of synthetic media</text>
    </g>
    <g transform="translate(15, 75)">
      <circle cx="8" cy="8" r="5" fill="#f59e0b"/>
      <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#b45309">Targeting precision</text>
    </g>
    <g transform="translate(15, 95)">
      <circle cx="8" cy="8" r="5" fill="#f59e0b"/>
      <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#b45309">Cost per operation</text>
    </g>
    <g transform="translate(15, 115)">
      <circle cx="8" cy="8" r="5" fill="#f59e0b"/>
      <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#b45309">Attribution difficulty</text>
    </g>
    <g transform="translate(15, 135)">
      <circle cx="8" cy="8" r="5" fill="#f59e0b"/>
      <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#b45309">Barrier to entry for bad actors</text>
    </g>
  </g>

  <g filter="url(#aiShadow)" transform="translate(410, 260)">
    <rect width="360" height="165" rx="12" fill="white" stroke="#86efac" stroke-width="2"/>
    <text x="180" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#166534">What Stays the Same</text>

    <g transform="translate(15, 35)">
      <circle cx="8" cy="8" r="5" fill="#22c55e"/>
      <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Human psychology and biases</text>
    </g>
    <g transform="translate(15, 55)">
      <circle cx="8" cy="8" r="5" fill="#22c55e"/>
      <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Need for trust and verification</text>
    </g>
    <g transform="translate(15, 75)">
      <circle cx="8" cy="8" r="5" fill="#22c55e"/>
      <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Social dynamics of spread</text>
    </g>
    <g transform="translate(15, 95)">
      <circle cx="8" cy="8" r="5" fill="#22c55e"/>
      <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Value of media literacy</text>
    </g>
    <g transform="translate(15, 115)">
      <circle cx="8" cy="8" r="5" fill="#22c55e"/>
      <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Importance of source credibility</text>
    </g>
    <g transform="translate(15, 135)">
      <circle cx="8" cy="8" r="5" fill="#22c55e"/>
      <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Fundamental intervention strategies</text>
    </g>
  </g>
</svg>