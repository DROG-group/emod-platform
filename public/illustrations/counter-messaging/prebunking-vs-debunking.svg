<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <filter id="cmShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Prebunking vs Debunking</text>
  <text x="400" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Two complementary approaches to fighting misinformation</text>

  <!-- Prebunking -->
  <g filter="url(#cmShadow)" transform="translate(30, 70)">
    <rect width="360" height="290" rx="16" fill="white" stroke="#86efac" stroke-width="2"/>
    <rect width="360" height="45" rx="16" fill="#10b981"/>
    <rect width="360" height="20" y="25" fill="#10b981"/>
    <text x="180" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">PREBUNKING</text>
    <text x="180" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#166534">Inoculation before exposure</text>

    <!-- Timeline visualization -->
    <g transform="translate(30, 80)">
      <line x1="0" y1="20" x2="300" y2="20" stroke="#d1d5db" stroke-width="2"/>
      <circle cx="50" cy="20" r="8" fill="#22c55e"/>
      <text x="50" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">Prebunk</text>
      <circle cx="150" cy="20" r="8" fill="#fbbf24"/>
      <text x="150" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#92400e">Exposure</text>
      <circle cx="250" cy="20" r="8" fill="#86efac"/>
      <text x="250" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">Protected</text>
    </g>

    <text x="25" y="145" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#166534">How it works:</text>
    <text x="30" y="162" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Warn people about manipulation tactics in advance</text>
    <text x="30" y="177" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Explain how specific techniques work</text>
    <text x="30" y="192" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Show weakened examples ("microdoses")</text>
    <text x="30" y="207" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Build mental antibodies before real exposure</text>

    <rect x="20" y="220" width="320" height="55" rx="8" fill="#f0fdf4"/>
    <text x="180" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#166534">Advantages</text>
    <text x="30" y="256" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">✓ Works before belief forms  ✓ Scales well</text>
    <text x="30" y="268" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">✓ Doesn't require specific claims  ✓ Builds general resilience</text>
  </g>

  <!-- Debunking -->
  <g filter="url(#cmShadow)" transform="translate(410, 70)">
    <rect width="360" height="290" rx="16" fill="white" stroke="#93c5fd" stroke-width="2"/>
    <rect width="360" height="45" rx="16" fill="#3b82f6"/>
    <rect width="360" height="20" y="25" fill="#3b82f6"/>
    <text x="180" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">DEBUNKING</text>
    <text x="180" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1e40af">Correction after exposure</text>

    <!-- Timeline visualization -->
    <g transform="translate(30, 80)">
      <line x1="0" y1="20" x2="300" y2="20" stroke="#d1d5db" stroke-width="2"/>
      <circle cx="50" cy="20" r="8" fill="#fbbf24"/>
      <text x="50" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#92400e">Exposure</text>
      <circle cx="150" cy="20" r="8" fill="#ef4444"/>
      <text x="150" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b">Belief forms</text>
      <circle cx="250" cy="20" r="8" fill="#3b82f6"/>
      <text x="250" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#1e40af">Debunk</text>
    </g>

    <text x="25" y="145" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1e40af">How it works:</text>
    <text x="30" y="162" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Identify specific false claims</text>
    <text x="30" y="177" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Provide accurate correction with evidence</text>
    <text x="30" y="192" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Explain why the false claim is wrong</text>
    <text x="30" y="207" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Offer alternative accurate narrative</text>

    <rect x="20" y="220" width="320" height="55" rx="8" fill="#eff6ff"/>
    <text x="180" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1e40af">Challenges</text>
    <text x="30" y="256" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">⚠ Belief already formed  ⚠ Can backfire if done poorly</text>
    <text x="30" y="268" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">⚠ Requires specific responses  ⚠ May amplify false claim</text>
  </g>
</svg>