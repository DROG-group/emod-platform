<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <filter id="behShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Behavioral Indicators</text>
  <text x="400" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">How accounts behave reveals more than what they say</text>

  <!-- Authentic vs Inauthentic comparison -->
  <g transform="translate(50, 75)">
    <!-- Authentic side -->
    <g filter="url(#behShadow)">
      <rect width="330" height="190" rx="12" fill="white" stroke="#86efac" stroke-width="2"/>
      <rect width="330" height="35" rx="12" fill="#10b981"/>
      <rect width="330" height="15" y="20" fill="#10b981"/>
      <text x="165" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">Authentic Account Behavior</text>

      <g transform="translate(20, 50)">
        <circle cx="8" cy="8" r="5" fill="#22c55e"/>
        <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Varied posting times (life happens)</text>
      </g>
      <g transform="translate(20, 72)">
        <circle cx="8" cy="8" r="5" fill="#22c55e"/>
        <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Multiple topics of interest</text>
      </g>
      <g transform="translate(20, 94)">
        <circle cx="8" cy="8" r="5" fill="#22c55e"/>
        <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Natural language variation</text>
      </g>
      <g transform="translate(20, 116)">
        <circle cx="8" cy="8" r="5" fill="#22c55e"/>
        <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Responds to replies conversationally</text>
      </g>
      <g transform="translate(20, 138)">
        <circle cx="8" cy="8" r="5" fill="#22c55e"/>
        <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Organic follower growth over time</text>
      </g>
      <g transform="translate(20, 160)">
        <circle cx="8" cy="8" r="5" fill="#22c55e"/>
        <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Shares personal content/opinions</text>
      </g>
    </g>

    <!-- Suspicious side -->
    <g filter="url(#behShadow)" transform="translate(370, 0)">
      <rect width="330" height="190" rx="12" fill="white" stroke="#fecaca" stroke-width="2"/>
      <rect width="330" height="35" rx="12" fill="#ef4444"/>
      <rect width="330" height="15" y="20" fill="#ef4444"/>
      <text x="165" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">Suspicious Account Behavior</text>

      <g transform="translate(20, 50)">
        <circle cx="8" cy="8" r="5" fill="#dc2626"/>
        <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b">Uniform posting schedule (shift-based)</text>
      </g>
      <g transform="translate(20, 72)">
        <circle cx="8" cy="8" r="5" fill="#dc2626"/>
        <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b">Single topic obsession</text>
      </g>
      <g transform="translate(20, 94)">
        <circle cx="8" cy="8" r="5" fill="#dc2626"/>
        <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b">Repetitive/templated language</text>
      </g>
      <g transform="translate(20, 116)">
        <circle cx="8" cy="8" r="5" fill="#dc2626"/>
        <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b">Ignores replies or gives canned responses</text>
      </g>
      <g transform="translate(20, 138)">
        <circle cx="8" cy="8" r="5" fill="#dc2626"/>
        <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b">Sudden follower spikes</text>
      </g>
      <g transform="translate(20, 160)">
        <circle cx="8" cy="8" r="5" fill="#dc2626"/>
        <text x="22" y="12" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b">Only shares third-party content</text>
      </g>
    </g>
  </g>

  <!-- Posting Pattern Visualization -->
  <g filter="url(#behShadow)" transform="translate(50, 285)">
    <rect width="700" height="100" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <text x="350" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Posting Time Patterns (24-hour view)</text>

    <!-- Organic pattern -->
    <text x="30" y="50" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Organic:</text>
    <g transform="translate(90, 38)">
      <rect x="0" y="0" width="10" height="3" fill="#86efac"/>
      <rect x="15" y="0" width="10" height="5" fill="#86efac"/>
      <rect x="30" y="0" width="10" height="2" fill="#86efac"/>
      <rect x="45" y="0" width="10" height="1" fill="#86efac"/>
      <rect x="60" y="0" width="10" height="1" fill="#86efac"/>
      <rect x="75" y="0" width="10" height="1" fill="#86efac"/>
      <rect x="90" y="0" width="10" height="2" fill="#86efac"/>
      <rect x="105" y="0" width="10" height="8" fill="#22c55e"/>
      <rect x="120" y="0" width="10" height="15" fill="#22c55e"/>
      <rect x="135" y="0" width="10" height="12" fill="#22c55e"/>
      <rect x="150" y="0" width="10" height="18" fill="#22c55e"/>
      <rect x="165" y="0" width="10" height="10" fill="#22c55e"/>
      <rect x="180" y="0" width="10" height="8" fill="#86efac"/>
      <rect x="195" y="0" width="10" height="6" fill="#86efac"/>
      <rect x="210" y="0" width="10" height="10" fill="#22c55e"/>
      <rect x="225" y="0" width="10" height="14" fill="#22c55e"/>
      <rect x="240" y="0" width="10" height="12" fill="#22c55e"/>
      <rect x="255" y="0" width="10" height="8" fill="#86efac"/>
      <rect x="270" y="0" width="10" height="5" fill="#86efac"/>
      <rect x="285" y="0" width="10" height="4" fill="#86efac"/>
      <rect x="300" y="0" width="10" height="2" fill="#86efac"/>
      <rect x="315" y="0" width="10" height="1" fill="#86efac"/>
    </g>

    <!-- Automated pattern -->
    <text x="30" y="80" font-family="system-ui, sans-serif" font-size="9" fill="#dc2626">Automated:</text>
    <g transform="translate(90, 68)">
      <rect x="0" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="15" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="30" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="45" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="60" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="75" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="90" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="105" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="120" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="135" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="150" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="165" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="180" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="195" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="210" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="225" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="240" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="255" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="270" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="285" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="300" y="0" width="10" height="10" fill="#fca5a5"/>
      <rect x="315" y="0" width="10" height="10" fill="#fca5a5"/>
    </g>

    <text x="450" y="55" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Variable height = human sleep/work cycles</text>
    <text x="450" y="85" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Uniform height = automated/shift work</text>
  </g>

  <!-- Warning box -->
  <g transform="translate(50, 400)">
    <rect width="700" height="80" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
    <text x="350" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Important Caveats</text>
    <g transform="translate(20, 38)">
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#b45309">• Single suspicious indicators are not proof - look for patterns across multiple signals</text>
    </g>
    <g transform="translate(20, 55)">
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#b45309">• Night-shift workers and insomniacs exist - unusual times alone don't prove automation</text>
    </g>
    <g transform="translate(380, 38)">
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#b45309">• Passionate activists can look obsessive</text>
    </g>
    <g transform="translate(380, 55)">
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#b45309">• PR professionals use scheduling tools</text>
    </g>
  </g>
</svg>