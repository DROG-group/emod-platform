<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <filter id="toolShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Verification Toolkit</text>
  <text x="400" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Tools for different verification tasks</text>

  <!-- Image Verification -->
  <g filter="url(#toolShadow)" transform="translate(30, 65)">
    <rect width="175" height="160" rx="12" fill="white" stroke="#93c5fd" stroke-width="2"/>
    <rect width="175" height="30" rx="12" fill="#3b82f6"/>
    <rect width="175" height="10" y="20" fill="#3b82f6"/>
    <text x="87" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">Image Verification</text>

    <text x="15" y="52" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1e40af">Tools:</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Google Reverse Image</text>
    <text x="20" y="81" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• TinEye</text>
    <text x="20" y="94" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Yandex Images</text>
    <text x="20" y="107" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• FotoForensics (ELA)</text>

    <rect x="10" y="120" width="155" height="30" rx="6" fill="#eff6ff"/>
    <text x="87" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#1e40af">Find original source, detect</text>
    <text x="87" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#1e40af">manipulation, check context</text>
  </g>

  <!-- Video Verification -->
  <g filter="url(#toolShadow)" transform="translate(220, 65)">
    <rect width="175" height="160" rx="12" fill="white" stroke="#c4b5fd" stroke-width="2"/>
    <rect width="175" height="30" rx="12" fill="#8b5cf6"/>
    <rect width="175" height="10" y="20" fill="#8b5cf6"/>
    <text x="87" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">Video Verification</text>

    <text x="15" y="52" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#5b21b6">Tools:</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">• InVID/WeVerify</text>
    <text x="20" y="81" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">• YouTube DataViewer</text>
    <text x="20" y="94" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">• Frame-by-frame analysis</text>
    <text x="20" y="107" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">• Keyframe extraction</text>

    <rect x="10" y="120" width="155" height="30" rx="6" fill="#f3e8ff"/>
    <text x="87" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#5b21b6">Extract frames, find original</text>
    <text x="87" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#5b21b6">upload, check metadata</text>
  </g>

  <!-- Location Verification -->
  <g filter="url(#toolShadow)" transform="translate(410, 65)">
    <rect width="175" height="160" rx="12" fill="white" stroke="#86efac" stroke-width="2"/>
    <rect width="175" height="30" rx="12" fill="#10b981"/>
    <rect width="175" height="10" y="20" fill="#10b981"/>
    <text x="87" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">Location (Geolocation)</text>

    <text x="15" y="52" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#166534">Tools:</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Google Earth/Maps</text>
    <text x="20" y="81" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Wikimapia</text>
    <text x="20" y="94" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• SunCalc (shadow analysis)</text>
    <text x="20" y="107" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Street View</text>

    <rect x="10" y="120" width="155" height="30" rx="6" fill="#f0fdf4"/>
    <text x="87" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#166534">Match landmarks, verify</text>
    <text x="87" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#166534">claimed location</text>
  </g>

  <!-- Time Verification -->
  <g filter="url(#toolShadow)" transform="translate(600, 65)">
    <rect width="175" height="160" rx="12" fill="white" stroke="#fde68a" stroke-width="2"/>
    <rect width="175" height="30" rx="12" fill="#f59e0b"/>
    <rect width="175" height="10" y="20" fill="#f59e0b"/>
    <text x="87" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">Time (Chronolocation)</text>

    <text x="15" y="52" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#92400e">Tools:</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">• SunCalc (sun position)</text>
    <text x="20" y="81" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">• Weather archives</text>
    <text x="20" y="94" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">• Wayback Machine</text>
    <text x="20" y="107" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">• Social media archives</text>

    <rect x="10" y="120" width="155" height="30" rx="6" fill="#fef3c7"/>
    <text x="87" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#92400e">Match shadows, weather,</text>
    <text x="87" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#92400e">verify claimed date</text>
  </g>

  <!-- Verification Workflow -->
  <g filter="url(#toolShadow)" transform="translate(30, 245)">
    <rect width="740" height="155" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <text x="370" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Verification Workflow</text>

    <!-- Steps -->
    <g transform="translate(30, 45)">
      <circle cx="20" cy="20" r="18" fill="#3b82f6"/>
      <text x="20" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">1</text>
      <text x="20" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#1e40af">Source</text>
      <text x="20" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">Who shared first?</text>
    </g>

    <line x1="70" y1="65" x2="120" y2="65" stroke="#cbd5e1" stroke-width="2"/>

    <g transform="translate(140, 45)">
      <circle cx="20" cy="20" r="18" fill="#8b5cf6"/>
      <text x="20" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">2</text>
      <text x="20" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b21b6">Origin</text>
      <text x="20" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">Is this the original?</text>
    </g>

    <line x1="180" y1="65" x2="230" y2="65" stroke="#cbd5e1" stroke-width="2"/>

    <g transform="translate(250, 45)">
      <circle cx="20" cy="20" r="18" fill="#10b981"/>
      <text x="20" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">3</text>
      <text x="20" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">Location</text>
      <text x="20" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">Where was it taken?</text>
    </g>

    <line x1="290" y1="65" x2="340" y2="65" stroke="#cbd5e1" stroke-width="2"/>

    <g transform="translate(360, 45)">
      <circle cx="20" cy="20" r="18" fill="#f59e0b"/>
      <text x="20" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">4</text>
      <text x="20" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#92400e">Time</text>
      <text x="20" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">When was it created?</text>
    </g>

    <line x1="400" y1="65" x2="450" y2="65" stroke="#cbd5e1" stroke-width="2"/>

    <g transform="translate(470, 45)">
      <circle cx="20" cy="20" r="18" fill="#ef4444"/>
      <text x="20" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">5</text>
      <text x="20" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b">Manipulation</text>
      <text x="20" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">Has it been altered?</text>
    </g>

    <line x1="510" y1="65" x2="560" y2="65" stroke="#cbd5e1" stroke-width="2"/>

    <g transform="translate(580, 45)">
      <circle cx="20" cy="20" r="18" fill="#6366f1"/>
      <text x="20" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">6</text>
      <text x="20" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#4338ca">Context</text>
      <text x="20" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">What's the full story?</text>
    </g>

    <!-- Key insight -->
    <rect x="30" y="95" width="680" height="45" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="370" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#166534">Key principle: Verification is about answering specific questions, not just "is this real?"</text>
    <text x="370" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">A real image can still be misleading if presented in wrong context, time, or location</text>
  </g>
</svg>