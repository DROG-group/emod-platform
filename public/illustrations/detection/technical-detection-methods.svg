<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <filter id="techShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Technical Detection Methods</text>
  <text x="400" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">What technical analysis can and cannot tell you</text>

  <!-- Row 1: Account Analysis -->
  <g filter="url(#techShadow)" transform="translate(30, 70)">
    <rect width="235" height="175" rx="12" fill="white" stroke="#bfdbfe" stroke-width="2"/>
    <rect width="235" height="35" rx="12" fill="#3b82f6"/>
    <rect width="235" height="15" y="20" fill="#3b82f6"/>
    <text x="117" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">Account Analysis</text>

    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1e40af">What to examine:</text>
    <text x="20" y="72" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Creation date patterns</text>
    <text x="20" y="85" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Profile completeness</text>
    <text x="20" y="98" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Follower/following ratios</text>
    <text x="20" y="111" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Activity patterns (timing)</text>

    <rect x="15" y="125" width="205" height="40" rx="6" fill="#fef2f2"/>
    <text x="117" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#991b1b">Limitation:</text>
    <text x="117" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#b91c1c">Real users can look suspicious too</text>
  </g>

  <!-- Row 1: Content Analysis -->
  <g filter="url(#techShadow)" transform="translate(282, 70)">
    <rect width="235" height="175" rx="12" fill="white" stroke="#c4b5fd" stroke-width="2"/>
    <rect width="235" height="35" rx="12" fill="#8b5cf6"/>
    <rect width="235" height="15" y="20" fill="#8b5cf6"/>
    <text x="117" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">Content Analysis</text>

    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#5b21b6">What to examine:</text>
    <text x="20" y="72" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">• Language patterns</text>
    <text x="20" y="85" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">• Duplicate/near-duplicate text</text>
    <text x="20" y="98" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">• Template detection</text>
    <text x="20" y="111" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">• Translation artifacts</text>

    <rect x="15" y="125" width="205" height="40" rx="6" fill="#fef2f2"/>
    <text x="117" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#991b1b">Limitation:</text>
    <text x="117" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#b91c1c">Talking points ≠ coordination</text>
  </g>

  <!-- Row 1: Network Analysis -->
  <g filter="url(#techShadow)" transform="translate(534, 70)">
    <rect width="235" height="175" rx="12" fill="white" stroke="#86efac" stroke-width="2"/>
    <rect width="235" height="35" rx="12" fill="#10b981"/>
    <rect width="235" height="15" y="20" fill="#10b981"/>
    <text x="117" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">Network Analysis</text>

    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#166534">What to examine:</text>
    <text x="20" y="72" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Amplification patterns</text>
    <text x="20" y="85" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Coordination timing</text>
    <text x="20" y="98" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Cross-platform links</text>
    <text x="20" y="111" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Community isolation</text>

    <rect x="15" y="125" width="205" height="40" rx="6" fill="#fef2f2"/>
    <text x="117" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#991b1b">Limitation:</text>
    <text x="117" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#b91c1c">Organic communities coordinate too</text>
  </g>

  <!-- Row 2: Image/Video Analysis -->
  <g filter="url(#techShadow)" transform="translate(30, 260)">
    <rect width="235" height="175" rx="12" fill="white" stroke="#fde68a" stroke-width="2"/>
    <rect width="235" height="35" rx="12" fill="#f59e0b"/>
    <rect width="235" height="15" y="20" fill="#f59e0b"/>
    <text x="117" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">Image/Video Analysis</text>

    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#92400e">What to examine:</text>
    <text x="20" y="72" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">• Reverse image search</text>
    <text x="20" y="85" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">• EXIF metadata</text>
    <text x="20" y="98" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">• Manipulation artifacts</text>
    <text x="20" y="111" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">• AI generation signs</text>

    <rect x="15" y="125" width="205" height="40" rx="6" fill="#fef2f2"/>
    <text x="117" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#991b1b">Limitation:</text>
    <text x="117" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#b91c1c">Metadata often stripped by platforms</text>
  </g>

  <!-- Row 2: Infrastructure Analysis -->
  <g filter="url(#techShadow)" transform="translate(282, 260)">
    <rect width="235" height="175" rx="12" fill="white" stroke="#fda4af" stroke-width="2"/>
    <rect width="235" height="35" rx="12" fill="#f43f5e"/>
    <rect width="235" height="15" y="20" fill="#f43f5e"/>
    <text x="117" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">Infrastructure Analysis</text>

    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#be123c">What to examine:</text>
    <text x="20" y="72" font-family="system-ui, sans-serif" font-size="8" fill="#e11d48">• Domain registration (WHOIS)</text>
    <text x="20" y="85" font-family="system-ui, sans-serif" font-size="8" fill="#e11d48">• Hosting providers</text>
    <text x="20" y="98" font-family="system-ui, sans-serif" font-size="8" fill="#e11d48">• SSL certificates</text>
    <text x="20" y="111" font-family="system-ui, sans-serif" font-size="8" fill="#e11d48">• Historical records</text>

    <rect x="15" y="125" width="205" height="40" rx="6" fill="#fef2f2"/>
    <text x="117" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#991b1b">Limitation:</text>
    <text x="117" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#b91c1c">Privacy services obscure ownership</text>
  </g>

  <!-- Row 2: Automation Detection -->
  <g filter="url(#techShadow)" transform="translate(534, 260)">
    <rect width="235" height="175" rx="12" fill="white" stroke="#a5b4fc" stroke-width="2"/>
    <rect width="235" height="35" rx="12" fill="#6366f1"/>
    <rect width="235" height="15" y="20" fill="#6366f1"/>
    <text x="117" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white">Automation Detection</text>

    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#3730a3">What to examine:</text>
    <text x="20" y="72" font-family="system-ui, sans-serif" font-size="8" fill="#4f46e5">• Posting frequency</text>
    <text x="20" y="85" font-family="system-ui, sans-serif" font-size="8" fill="#4f46e5">• Time-of-day patterns</text>
    <text x="20" y="98" font-family="system-ui, sans-serif" font-size="8" fill="#4f46e5">• Response timing</text>
    <text x="20" y="111" font-family="system-ui, sans-serif" font-size="8" fill="#4f46e5">• API vs app indicators</text>

    <rect x="15" y="125" width="205" height="40" rx="6" fill="#fef2f2"/>
    <text x="117" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#991b1b">Limitation:</text>
    <text x="117" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#b91c1c">Legitimate tools use automation</text>
  </g>
</svg>