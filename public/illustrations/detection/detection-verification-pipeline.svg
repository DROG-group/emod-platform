<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="monitorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280"/>
      <stop offset="100%" style="stop-color:#9ca3af"/>
    </linearGradient>
    <linearGradient id="detectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="investigateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="verifyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="attributeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="pipeShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="pipeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Detection-Verification Pipeline</text>
  <text x="400" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Different skills, different questions at each stage</text>

  <!-- Funnel visualization at top -->
  <g transform="translate(100, 65)">
    <path d="M0,0 L600,0 L500,25 L100,25 Z" fill="#e2e8f0" opacity="0.5"/>
    <text x="300" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Lots of content enters → Very little exits with high confidence</text>
  </g>

  <!-- Stage 1: Monitoring -->
  <g filter="url(#pipeShadow)" transform="translate(30, 110)">
    <rect width="130" height="160" rx="12" fill="white" stroke="#d1d5db" stroke-width="2"/>
    <rect width="130" height="35" rx="12" fill="url(#monitorGrad)"/>
    <rect width="130" height="15" y="20" fill="url(#monitorGrad)"/>
    <text x="65" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">MONITORING</text>

    <text x="65" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#4b5563">Question:</text>
    <text x="65" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6b7280">"What's happening?"</text>

    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="8" fill="#6b7280">• Broad scanning</text>
    <text x="15" y="108" font-family="system-ui, sans-serif" font-size="8" fill="#6b7280">• Trend tracking</text>
    <text x="15" y="121" font-family="system-ui, sans-serif" font-size="8" fill="#6b7280">• Keyword alerts</text>

    <rect x="15" y="135" width="100" height="18" rx="4" fill="#f3f4f6"/>
    <text x="65" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#6b7280">Output: Awareness</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="165" y1="190" x2="185" y2="190" stroke="#cbd5e1" stroke-width="3" marker-end="url(#pipeArrow)"/>

  <!-- Stage 2: Detection -->
  <g filter="url(#pipeShadow)" transform="translate(190, 110)">
    <rect width="130" height="160" rx="12" fill="white" stroke="#93c5fd" stroke-width="2"/>
    <rect width="130" height="35" rx="12" fill="url(#detectGrad)"/>
    <rect width="130" height="15" y="20" fill="url(#detectGrad)"/>
    <text x="65" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">DETECTION</text>

    <text x="65" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1e40af">Question:</text>
    <text x="65" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">"Worth investigating?"</text>

    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Anomaly ID</text>
    <text x="15" y="108" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Pattern matching</text>
    <text x="15" y="121" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">• Signal filtering</text>

    <rect x="15" y="135" width="100" height="18" rx="4" fill="#dbeafe"/>
    <text x="65" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#1e40af">Output: Leads</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="325" y1="190" x2="345" y2="190" stroke="#cbd5e1" stroke-width="3" marker-end="url(#pipeArrow)"/>

  <!-- Stage 3: Investigation -->
  <g filter="url(#pipeShadow)" transform="translate(350, 110)">
    <rect width="130" height="160" rx="12" fill="white" stroke="#fcd34d" stroke-width="2"/>
    <rect width="130" height="35" rx="12" fill="url(#investigateGrad)"/>
    <rect width="130" height="15" y="20" fill="url(#investigateGrad)"/>
    <text x="65" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">INVESTIGATION</text>

    <text x="65" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#92400e">Question:</text>
    <text x="65" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">"What explains this?"</text>

    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">• Evidence gathering</text>
    <text x="15" y="108" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">• Hypothesis testing</text>
    <text x="15" y="121" font-family="system-ui, sans-serif" font-size="8" fill="#b45309">• Deep analysis</text>

    <rect x="15" y="135" width="100" height="18" rx="4" fill="#fef3c7"/>
    <text x="65" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#92400e">Output: Understanding</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="485" y1="190" x2="505" y2="190" stroke="#cbd5e1" stroke-width="3" marker-end="url(#pipeArrow)"/>

  <!-- Stage 4: Verification -->
  <g filter="url(#pipeShadow)" transform="translate(510, 110)">
    <rect width="130" height="160" rx="12" fill="white" stroke="#6ee7b7" stroke-width="2"/>
    <rect width="130" height="35" rx="12" fill="url(#verifyGrad)"/>
    <rect width="130" height="15" y="20" fill="url(#verifyGrad)"/>
    <text x="65" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="white">VERIFICATION</text>

    <text x="65" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#166534">Question:</text>
    <text x="65" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">"Can we confirm?"</text>

    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Source checking</text>
    <text x="15" y="108" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Corroboration</text>
    <text x="15" y="121" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">• Confidence rating</text>

    <rect x="15" y="135" width="100" height="18" rx="4" fill="#dcfce7"/>
    <text x="65" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#166534">Output: Conclusion</text>
  </g>

  <!-- Arrow 4 -->
  <line x1="645" y1="190" x2="665" y2="190" stroke="#cbd5e1" stroke-width="3" marker-end="url(#pipeArrow)"/>

  <!-- Stage 5: Attribution (Optional) -->
  <g filter="url(#pipeShadow)" transform="translate(670, 110)">
    <rect width="100" height="160" rx="12" fill="white" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="4,2"/>
    <rect width="100" height="35" rx="12" fill="url(#attributeGrad)"/>
    <rect width="100" height="15" y="20" fill="url(#attributeGrad)"/>
    <text x="50" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white">ATTRIBUTION</text>

    <text x="50" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#5b21b6">Question:</text>
    <text x="50" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#7c3aed">"Who did it?"</text>

    <text x="10" y="95" font-family="system-ui, sans-serif" font-size="7" fill="#7c3aed">• Actor ID</text>
    <text x="10" y="108" font-family="system-ui, sans-serif" font-size="7" fill="#7c3aed">• Motivation</text>
    <text x="10" y="121" font-family="system-ui, sans-serif" font-size="7" fill="#7c3aed">• Confidence</text>

    <rect x="10" y="135" width="80" height="18" rx="4" fill="#ede9fe"/>
    <text x="50" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="6" fill="#5b21b6">If needed</text>
  </g>

  <!-- Key insight -->
  <g transform="translate(30, 295)">
    <rect width="740" height="85" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="370" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#166534">Key Principles</text>

    <g transform="translate(20, 35)">
      <circle cx="6" cy="6" r="4" fill="#22c55e"/>
      <text x="18" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Detection ≠ Verification: Finding something suspicious is not the same as confirming it's problematic</text>
    </g>
    <g transform="translate(20, 52)">
      <circle cx="6" cy="6" r="4" fill="#22c55e"/>
      <text x="18" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Most activity is organic: The pipeline filters out noise at each stage - that's the point</text>
    </g>
    <g transform="translate(20, 69)">
      <circle cx="6" cy="6" r="4" fill="#22c55e"/>
      <text x="18" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Different skills: A good detector might be a poor verifier, and vice versa</text>
    </g>
  </g>
</svg>